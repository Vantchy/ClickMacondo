#bar button.on{background:rgba(184,137,62,.22);border-color:var(--gl);color:var(--gl)}

#leg{position:fixed;bottom:8px;left:8px;z-index:15;display:flex;gap:8px;flex-wrap:wrap;padding:5px 10px;background:rgba(6,4,3,.8);border:1px solid rgba(184,137,62,.1);border-radius:8px;font-size:.58rem;color:var(--gd);backdrop-filter:blur(4px)}

#hint{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:12;font-size:.58rem;color:rgba(184,137,62,.35);pointer-events:none;letter-spacing:.03em}

@keyframes pi{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
#pn.on{display:block}
#pn h3{font-family:Cinzel,'Noto Serif SC',serif;font-size:.78rem;color:var(--gl);letter-spacing:.05em;margin-bottom:2px;padding-right:20px}

.tn{background:rgba(100,145,185,.14);color:#8ab8d8;border:1px solid rgba(100,145,185,.25)}
.ts{background:rgba(120,165,120,.14);color:#90c090;border:1px solid rgba(120,165,120,.25)}
.tl{background:rgba(185,125,190,.14);color:#c0a0d0;border:1px solid rgba(185,125,190,.25)}

#pn .hl{border-left:2px solid #c080d0;padding-left:6px;margin-top:3px;font-size:.58rem;color:#d0b0e0}
#pn .rl2{border-left:2px solid #80b890;padding-left:6px;margin-top:3px;font-size:.58rem;color:#90c8a0}
