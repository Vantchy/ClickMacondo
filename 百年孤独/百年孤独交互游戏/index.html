<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>百年孤独 · 宿命之环</title>
<!-- Google Fonts: 衬线字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   一、CSS变量 & 全局重置
   ================================================================ */
:root {
  /* 配色 —— 高对比度复古旧书质感 */
  --bg-dark: #080604;
  --page-bg: rgba(255, 250, 240, 0.90);
  --page-bg-strong: rgba(255, 250, 240, 0.96);
  --text-main: #1a0f08;
  --text-title: #402618;
  --text-transition: #5c4a3b;
  --speaker-ursula: #a52020;
  --speaker-jose: #1a3a4a;
  --speaker-melquiades: #c4910a;
  --speaker-narrator: #4a2a18;
  --choice-bg: #faf3e8;
  --choice-border: #b8956a;
  --choice-hover-bg: #ecdcc8;
  --choice-active-bg: #c89860;
  --fate-low: #4a7a4a;
  --fate-mid: #c4910a;
  --fate-high: #a51a1a;
  --gold: #b8893e;
  --gold-light: #e8c870;
  --gold-dim: #d4b070;
  --spine-shadow: rgba(0,0,0,0.18);
  --sidebar-text: #e0d2bc;
  --sidebar-text-dim: #c0b090;

  /* 字体 */
  --font-body: 'Cormorant Garamond', 'Noto Serif SC', 'Georgia', 'STSong', serif;
  --font-title: 'Cinzel', 'Noto Serif SC', 'Times New Roman', serif;
  --font-ui: 'Noto Serif SC', 'Georgia', serif;

  /* 尺寸 */
  --topbar-h: 48px;
  --bottombar-h: 56px;
  --book-padding: 40px;
  --spine-width: 4px;

  /* 过渡 */
  --transition-speed: 0.35s;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-dark);
  font-family: var(--font-body);
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  color: var(--text-main);
}

/* ================================================================
   二、书页背景层
   ================================================================ */
#book-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: #241c12;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(200,155,80,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(200,155,80,0.04) 0%, transparent 50%),
    url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="400" height="400" filter="url(%23n)" opacity="0.02"/></svg>');
  opacity: 1;
}

/* 书页纹理叠加 */
#book-texture {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139,105,20,0.02) 2px, rgba(139,105,20,0.02) 4px);
  opacity: 0.35;
}

/* 暗角 */
#vignette {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  box-shadow: inset 0 0 180px 60px rgba(0,0,0,0.55);
}

/* ================================================================
   三、主布局 — CSS Grid 书页
   ================================================================ */
#app-container {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
}

/* 顶部栏 */
#top-bar {
  height: var(--topbar-h);
  z-index: 15;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  background: linear-gradient(to bottom, rgba(10,8,4,0.9) 0%, rgba(10,8,4,0.4) 100%);
  gap: 12px;
  flex-shrink: 0;
  backdrop-filter: blur(6px);
}

.top-item {
  display: flex;
  align-items: center;
  gap: 16px;
}

.top-btn {
  font-family: var(--font-ui);
  font-size: 0.68rem;
  color: var(--gold-dim);
  background: rgba(10,8,4,0.55);
  border: 1px solid rgba(184,137,62,0.22);
  padding: 5px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.top-btn:hover {
  background: rgba(184,137,62,0.12);
  border-color: rgba(184,137,62,0.45);
  color: #e8d0a0;
}

#chapter-select {
  font-family: var(--font-ui);
  font-size: 0.68rem;
  color: var(--gold-dim);
  background: rgba(10,8,4,0.55);
  border: 1px solid rgba(184,137,62,0.22);
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  letter-spacing: 0.05em;
  outline: none;
}
#chapter-select option {
  background: #14100c;
  color: #d4b070;
}

#progress-label {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  color: var(--gold-dim);
  letter-spacing: 0.08em;
  white-space: nowrap;
}

/* 宿命值显示 */
#fate-display {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-title);
  font-size: 0.75rem;
  color: var(--gold-dim);
  letter-spacing: 0.1em;
}
#fate-icon {
  font-size: 1rem;
}
#fate-value {
  font-weight: 700;
  font-size: 1.1rem;
  transition: color 0.5s ease, transform 0.3s ease;
  min-width: 24px;
  text-align: center;
}
#fate-value.pulse {
  animation: fatePulse 0.5s ease;
}

@keyframes fatePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.35); }
}

/* 书页区域 */
#book-area {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr var(--spine-width) 1fr;
  overflow: hidden;
  min-height: 0;
}

/* 左页 */
#left-page {
  position: relative;
  padding: 32px 28px 32px 36px;
  overflow-y: auto;
  overflow-x: hidden;
  background:
    linear-gradient(to right, rgba(0,0,0,0.04) 0%, transparent 6%),
    linear-gradient(to left, rgba(0,0,0,0.03) 0%, transparent 3%),
    rgba(255, 250, 240, 0.88);
  transition: opacity var(--transition-speed) ease;
}
#left-page.fading { opacity: 0; }

#left-page::-webkit-scrollbar { width: 4px; }
#left-page::-webkit-scrollbar-track { background: transparent; }
#left-page::-webkit-scrollbar-thumb { background: rgba(139,105,20,0.15); border-radius: 6px; }

/* 书脊 */
#spine {
  position: relative;
  background: linear-gradient(
    to right,
    rgba(0,0,0,0.12) 0%,
    rgba(0,0,0,0.18) 30%,
    rgba(0,0,0,0.22) 50%,
    rgba(0,0,0,0.18) 70%,
    rgba(0,0,0,0.12) 100%
  );
  box-shadow:
    -2px 0 8px rgba(0,0,0,0.1),
    2px 0 8px rgba(0,0,0,0.1);
  z-index: 2;
}

/* 右页 */
#right-page {
  position: relative;
  padding: 32px 36px 32px 28px;
  overflow-y: auto;
  overflow-x: hidden;
  background:
    linear-gradient(to left, rgba(0,0,0,0.04) 0%, transparent 6%),
    linear-gradient(to right, rgba(0,0,0,0.03) 0%, transparent 3%),
    rgba(255, 250, 240, 0.88);
  transition: opacity var(--transition-speed) ease;
}
#right-page.fading { opacity: 0; }

#right-page::-webkit-scrollbar { width: 4px; }
#right-page::-webkit-scrollbar-track { background: transparent; }
#right-page::-webkit-scrollbar-thumb { background: rgba(139,105,20,0.15); border-radius: 6px; }

/* 底部栏 */
#bottom-bar {
  height: var(--bottombar-h);
  z-index: 15;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 8px 20px 14px;
  background: linear-gradient(to top, rgba(10,8,4,0.9) 0%, rgba(10,8,4,0.4) 100%);
  backdrop-filter: blur(6px);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.bottom-btn {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  color: var(--gold-dim);
  background: rgba(10,8,4,0.55);
  border: 1px solid rgba(184,137,62,0.2);
  padding: 6px 16px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 0.06em;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
}
.bottom-btn:hover {
  background: rgba(184,137,62,0.12);
  border-color: rgba(184,137,62,0.45);
  color: #e8d0a0;
}

/* ================================================================
   四、左页叙事区样式
   ================================================================ */
.scene-title {
  font-family: var(--font-title);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-title);
  letter-spacing: 0.1em;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(196,149,74,0.2);
  text-align: center;
}

.speaker-label {
  display: inline-block;
  font-family: var(--font-title);
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}
.speaker-label.ursula { color: var(--speaker-ursula); }
.speaker-label.jose { color: var(--speaker-jose); }
.speaker-label.melquiades { color: var(--speaker-melquiades); }
.speaker-label.narrator { color: var(--speaker-narrator); }

.narrative-paragraph {
  font-size: 1.05rem;
  line-height: 1.9;
  color: var(--text-main);
  text-indent: 2em;
  margin-bottom: 14px;
  text-align: justify;
  letter-spacing: 0.01em;
}

.narrative-quote {
  display: block;
  margin: 8px 0 14px 16px;
  padding: 8px 16px;
  border-left: 2px solid var(--gold);
  font-style: italic;
  color: #3a2518;
  font-size: 1rem;
  line-height: 1.8;
  background: rgba(196,149,74,0.08);
}

.transition-text {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px dashed rgba(139,105,20,0.15);
  font-style: italic;
  color: var(--text-transition);
  font-size: 0.95rem;
  line-height: 1.7;
  text-align: center;
}

.memory-hint {
  margin-top: 20px;
  padding: 10px 16px;
  background: rgba(196,149,74,0.1);
  border: 1px solid rgba(184,137,62,0.25);
  border-radius: 6px;
  font-size: 0.8rem;
  color: #5c4a3b;
  text-align: center;
  font-style: italic;
}
.memory-hint::before {
  content: '💎 ';
}

/* ================================================================
   五、右页交互区样式
   ================================================================ */
.right-section-title {
  font-family: var(--font-title);
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-title);
  text-align: center;
  margin-bottom: 20px;
  letter-spacing: 0.08em;
}

.choices-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.choice-btn {
  display: block;
  width: 100%;
  padding: 18px 22px;
  background: rgba(250, 243, 232, 0.94);
  border: 1px solid var(--choice-border);
  border-radius: 6px;
  font-family: var(--font-body);
  font-size: 1.05rem;
  text-align: left;
  color: var(--text-main);
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  letter-spacing: 0.02em;
}
.choice-btn:hover {
  background: var(--choice-hover-bg);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.14);
  border-color: #a07848;
}
.choice-btn:active {
  background: var(--choice-active-bg);
  transform: translateY(0);
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.choice-btn .choice-label {
  display: block;
  font-weight: 600;
  font-family: var(--font-title);
  font-size: 1rem;
  color: var(--text-title);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
}
.choice-btn .choice-desc {
  display: block;
  font-size: 0.88rem;
  color: #4a3a2a;
  line-height: 1.5;
  font-style: italic;
}

/* 结算面板 */
.settlement-panel {
  background: rgba(250, 243, 232, 0.94);
  border: 1px solid var(--choice-border);
  border-radius: 8px;
  padding: 24px;
}

.settlement-summary {
  font-size: 0.95rem;
  line-height: 1.8;
  color: var(--text-main);
  text-align: center;
  margin-bottom: 16px;
  font-style: italic;
}

.settlement-table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 0.88rem;
}
.settlement-table th {
  font-family: var(--font-title);
  font-size: 0.75rem;
  color: var(--text-title);
  padding: 8px 10px;
  border-bottom: 1px solid var(--choice-border);
  letter-spacing: 0.05em;
}
.settlement-table td {
  padding: 8px 10px;
  text-align: center;
  border-bottom: 1px solid rgba(196,149,74,0.12);
  color: var(--text-main);
}

.tag-badge {
  display: inline-block;
  padding: 3px 12px;
  background: rgba(184,137,62,0.15);
  border: 1px solid rgba(184,137,62,0.3);
  border-radius: 12px;
  font-size: 0.75rem;
  color: #3a2018;
  margin: 2px 4px;
}

.profile-tags .tag-badge {
  color: #e0d8d2;
  font-weight: 600;
}

.fate-summary {
  text-align: center;
  font-family: var(--font-title);
  font-size: 0.9rem;
  margin-top: 16px;
  letter-spacing: 0.06em;
}

.next-btn {
  display: block;
  width: 80%;
  margin: 20px auto 0;
  padding: 14px 24px;
  background: linear-gradient(135deg, rgba(184,137,62,0.22), rgba(184,137,62,0.1));
  border: 1px solid var(--gold);
  border-radius: 30px;
  font-family: var(--font-title);
  font-size: 0.95rem;
  color: #9a7030;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 0.1em;
  text-align: center;
}
.next-btn:hover {
  background: linear-gradient(135deg, rgba(184,137,62,0.38), rgba(184,137,62,0.18));
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(184,137,62,0.2);
  color: #b8893e;
}

/* 记忆碎片卡片 修复蓝白色冰低对比度问题 */
.memory-card {
  position: relative;
  margin-top: 16px;
  padding: 16px 20px;
  /* 原淡蓝冷渐变加深、弱化透光白雾 */
  background: linear(135deg, rgba(184,137,0.18), rgba(8,6,4,0.65));
  border: 1px solid var(--gold);
  border-radius: 8px;
  animation: memorySlideIn 0.5s ease;
  box-shadow: 0 0 16px rgba(184,137,62,0.12);
}
@keyframes memorySlideIn {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.memory-card-title {
  font-family: var(--font-title);
  font-size: 0.85rem;
  color: var(--gold-light);
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  font-weight: 600; /* 加粗提升醒目度 */
}
.memory-card-desc {
  font-size: 0.82rem;
  color: #c8b290; /* 原#d4c0a0加深，解决淡字看不清 */
  line-height: 1.6;
  font-style: italic;
}


/* ================================================================
   六、侧边栏（通用）
   ================================================================ */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0,0,0,0.6);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
.sidebar-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.sidebar-panel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(420px, 90vw);
  z-index: 55;
  background: linear-gradient(135deg, #14100c, #0e0b08);
  border-left: 1px solid rgba(184,137,62,0.2);
  box-shadow: -8px 0 30px rgba(0,0,0,0.6);
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
}
.sidebar-panel.open {
  transform: translateX(0);
}

.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(184,137,62,0.2);
}
.sidebar-title {
  font-family: var(--font-title);
  font-size: 1.1rem;
  color: var(--gold-light);
  letter-spacing: 0.08em;
}
.sidebar-close {
  background: none;
  border: 1px solid rgba(184,137,62,0.3);
  color: var(--gold-dim);
  font-size: 1.2rem;
  cursor: pointer;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}
.sidebar-close:hover {
  background: rgba(184,137,62,0.15);
  border-color: var(--gold);
  color: var(--gold-light);
}

.sidebar-content {
  flex: 1;
  overflow-y: auto;
}

/* 家族树 */
.family-member {
  padding: 10px 14px;
  margin: 6px 0;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(184,137,62,0.15);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.family-member:hover {
  background: rgba(184,137,62,0.1);
  border-color: rgba(184,137,62,0.35);
}
.family-member.current {
  border-color: var(--gold);
  background: rgba(184,137,62,0.15);
}
.family-member .fm-name {
  font-family: var(--font-title);
  font-size: 0.9rem;
  color: #e8d0a0;
  letter-spacing: 0.04em;
}
.family-member .fm-relation {
  font-size: 0.7rem;
  color: var(--gold-dim);
  margin-top: 2px;
}
.family-tree-connector {
  width: 2px;
  height: 16px;
  background: rgba(184,137,62,0.18);
  margin: 0 auto;
}

/* 历史档案 */
.archive-item {
  padding: 12px 16px;
  margin: 8px 0;
  border-radius: 6px;
  border: 1px solid rgba(184,137,62,0.15);
  background: rgba(255,255,255,0.03);
  transition: all 0.3s ease;
}
.archive-item.unlocked { border-color: rgba(184,137,62,0.35); }
.archive-item.locked {
  opacity: 0.45;
  filter: grayscale(0.4);
}
.archive-item .archive-chapter {
  font-size: 0.65rem;
  color: var(--gold-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.archive-item .archive-title {
  font-family: var(--font-title);
  font-size: 0.9rem;
  color: #e8d0a0;
  margin-top: 2px;
  letter-spacing: 0.04em;
}
.archive-item .archive-desc {
  font-size: 0.8rem;
  color: #c0b090;
  margin-top: 4px;
  line-height: 1.4;
}
.locked .archive-title::after {
  content: ' ❓';
}

/* 个人简介 */
.profile-section {
  margin-bottom: 20px;
}
.profile-section h4 {
  font-family: var(--font-title);
  font-size: 0.8rem;
  color: var(--gold-light);
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(184,137,62,0.18);
}
.profile-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.profile-choice-log {
  font-size: 0.82rem;
  color: #d0c0a0;
  line-height: 1.8;
}
.profile-fate-level {
  font-family: var(--font-title);
  font-size: 1.1rem;
  text-align: center;
  padding: 12px;
  background: rgba(184,137,62,0.08);
  border-radius: 8px;
  margin-top: 8px;
}

/* ================================================================
   七、设置面板（模态框）
   ================================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal-panel {
  background: linear-gradient(135deg, #181410, #12100c);
  border: 1px solid rgba(184,137,62,0.25);
  border-radius: 12px;
  padding: 28px 32px;
  width: min(380px, 90vw);
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
}

.modal-title {
  font-family: var(--font-title);
  font-size: 1rem;
  color: #e8d0a0;

/* ================================================================
   二、游戏状态管理
   ================================================================ */
const GameState = {
  currentScene: 'prologue',
  chapter: 1,
  round: 0,
  tags: [],
  fateCounter: 0,
  antiFateCounter: 0,
  memories: [],
  history: [],
  choices: [],
  choiceLog: [],

  reset() {
    this.currentScene = 'prologue';
    this.chapter = 1;
    this.round = 0;
    this.tags = [];
    this.fateCounter = 0;
    this.antiFateCounter = 0;
    this.memories = [];
    this.history = ['prologue'];
    this.choices = [];
    this.choiceLog = [];
  },

  getFateLevel() {
    const f = this.fateCounter;
    if (f <= 3) return { level: '宿命抗争者', color: 'var(--fate-low)', desc: '你还在与命运搏斗。你相信自己可以改变方向。' };
    if (f <= 7) return { level: '宿命追随者', color: 'var(--fate-mid)', desc: '你开始听见命运的低语。你偶尔会在夜里惊醒，感觉一切都已经被写好了。' };
    return { level: '宿命见证者', color: 'var(--fate-high)', desc: '你已经知道答案了。你只是还在走着看。' };
  },

  toJSON() {
    return {
      currentScene: this.currentScene,
      chapter: this.chapter,
      round: this.round,
      tags: [...this.tags],
      fateCounter: this.fateCounter,
      antiFateCounter: this.antiFateCounter,
      memories: [...this.memories],
      history: [...this.history],
      choices: [...this.choices],
      choiceLog: [...this.choiceLog]
    };
  },

  fromJSON(data) {
    this.currentScene = data.currentScene;
    this.chapter = data.chapter;
    this.round = data.round;
    this.tags = data.tags || [];
    this.fateCounter = data.fateCounter || 0;
    this.antiFateCounter = data.antiFateCounter || 0;
    this.memories = data.memories || [];
    this.history = data.history || [];
    this.choices = data.choices || [];
    this.choiceLog = data.choiceLog || [];
  }
};

/* ================================================================
   三、游戏引擎
   ================================================================ */
const GameEngine = {
  selectChoice(choiceId) {
    const scene = this.getCurrentScene();
    if (!scene || scene.type !== 'choice') return null;

    const choice = scene.choices.find(c => c.id === choiceId);
    if (!choice) return null;

    // 记录选择
    GameState.choices.push(choiceId);
    GameState.choiceLog.push({
      round: scene.round,
      choiceId: choiceId,
      label: choice.label,
      tags: choice.effects.tags,
      fate: choice.effects.fate,
      memory: choice.effects.memory
    });

    // 应用效果
    if (choice.effects.tags) {
      choice.effects.tags.forEach(t => {
        if (!GameState.tags.includes(t)) GameState.tags.push(t);
      });
    }

    if (choice.effects.fate) {
      if (choice.effects.antiFate) {
        GameState.antiFateCounter += choice.effects.fate;
      } else {
        GameState.fateCounter += choice.effects.fate;
      }
      // 限制宿命值在0-10之间
      GameState.fateCounter = Math.min(10, Math.max(0, GameState.fateCounter));
    }

    if (choice.effects.memory && !GameState.memories.includes(choice.effects.memory)) {
      GameState.memories.push(choice.effects.memory);
    }

    // 先跳转到分支叙事
    const nextSceneId = choice.nextScene;
    GameState.history.push(nextSceneId);
    GameState.currentScene = nextSceneId;
    GameState.round = scene.round;

    // 自动保存
    StorageManager.save();

    return choice;
  },

  goToScene(sceneId) {
    GameState.history.push(sceneId);
    GameState.currentScene = sceneId;
    const scene = chapter1Data.scenes[sceneId];
    if (scene) {
      GameState.round = scene.round || GameState.round;
    }
    StorageManager.save();
  },

  getCurrentScene() {
    return chapter1Data.scenes[GameState.currentScene] || null;
  },

  goToSettlement() {
    const scene = this.getCurrentScene();
    // 找到当前回合的结算场景
    if (scene && scene.type === 'narrative' && scene.nextScene) {
      this.goToScene(scene.nextScene);
    }
  },

  getChapterEndScene() {
    return chapter1Data.scenes['chapter1_end'];
  },

  resetGame() {
    GameState.reset();
    StorageManager.clear();
  }
};

/* ================================================================
   四、存档/读档工具
   ================================================================ */
const StorageManager = {
  SAVE_KEY: 'cien_anos_save_v2',

  save() {
    try {
      const data = GameState.toJSON();
      localStorage.setItem(this.SAVE_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      console.warn('存档失败:', e);
      return false;
    }
  },

  load() {
    try {
      const raw = localStorage.getItem(this.SAVE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      GameState.fromJSON(data);
      return true;
    } catch (e) {
      console.warn('读档失败:', e);
      return false;
    }
  },

  hasSave() {
    return localStorage.getItem(this.SAVE_KEY) !== null;
  },

  clear() {
    localStorage.removeItem(this.SAVE_KEY);
  }
};

/* ================================================================
   五、Toast 提示
   ================================================================ */
let toastTimer = null;
function showToast(msg, duration = 2000) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, duration);
}

const Renderer = {
  /* 渲染整个页面 */
  render() {
    const scene = GameEngine.getCurrentScene();
    if (!scene) return;
    this.renderLeftPage(scene);
    this.renderRightPage(scene);
    this.updateTopBar(scene);
    this.updateBookmark();
  },

  /* 渲染左页（叙事区） */
  renderLeftPage(scene) {
    const leftPage = document.getElementById('left-page');
    if (!leftPage) return;

    // 淡出
    leftPage.classList.add('fading');

    setTimeout(() => {
      let html = '';
      const lp = scene.leftPage;

      if (scene.title) {

        html += `<div class="speaker-label ${colorClass}" style="color: ${lp.speakerColor || ''}">${lp.speaker}：</div>`;
      }

      // 正文段落
      if (lp.paragraphs) {
        lp.paragraphs.forEach(p => {
          html += `<p class="narrative-paragraph">${p}</p>`;
        });
      }

      // 引用1
      if (lp.quotes) {
        lp.quotes.forEach(q => {
          html += `<span class="narrative-quote">${q}</span>`;
        });
      }

      // 引用后正文
      if (lp.postQuote) {
        lp.postQuote.forEach(p => {
          html += `<p class="narrative-paragraph">${p}</p>`;
        });
      }

      // 引用2
      if (lp.quotes2) {
        lp.quotes2.forEach(q => {
          html += `<span class="narrative-quote">${q}</span>`;
        });
      }

      // 引用2后正文
      if (lp.postQuote2) {
        lp.postQuote2.forEach(p => {
          html += `<p class="narrative-paragraph">${p}</p>`;
        });
      }

      // 过渡文字
      if (lp.transition) {
        html += `<div class="transition-text">${lp.transition}</div>`;
      }

      leftPage.innerHTML = html;
      leftPage.scrollTop = 0;
      leftPage.classList.remove('fading');
    }, 300);
  },

  /* 渲染右页（交互区） */
  renderRightPage(scene) {
    const rightPage = document.getElementById('right-page');
    if (!rightPage) return;

    rightPage.classList.add('fading');

    setTimeout(() => {
      let html = '';

      if (scene.type === 'choice' && scene.choices) {
        // 选项模式
        html += `<div class="right-section-title">做出你的选择</div>`;
        html += `<div class="choices-list">`;
        scene.choices.forEach(choice => {
          html += `
            <button class="choice-btn" data-choice-id="${choice.id}" onclick="handleChoice('${choice.id}')">
              <span class="choice-label">${choice.label}</span>
              <span class="choice-desc">${choice.description}</span>
            </button>`;
        });
        html += `</div>`;
      } else if (scene.type === 'settlement' && scene.settlement) {
        // 结算模式
        const st = scene.settlement;
        html += `<div class="right-section-title">📋 结算</div>`;
        html += `<div class="settlement-panel">`;

        if (st.summary) {
          html += `<div class="settlement-summary">${st.summary}</div>`;
        }

        // 显示本轮获得的标签
        if (GameState.choiceLog.length > 0) {
          const lastChoice = GameState.choiceLog[GameState.choiceLog.length - 1];
          if (lastChoice && lastChoice.tags.length > 0) {
            html += `<div style="text-align:center;margin:12px 0;">`;
            html += `<div style="font-size:0.75rem;color:var(--gold-dim);margin-bottom:6px;">获得标签：</div>`;
            lastChoice.tags.forEach(t => {
              html += `<span class="tag-badge">${t}</span>`;
            });
            html += `</div>`;
          }
        }

        // 宿命值
        const fateLevel = GameState.getFateLevel();
        html += `<div class="fate-summary" style="color: ${fateLevel.color}">`;
        html += `宿命值：${GameState.fateCounter} · ${fateLevel.level}`;
        html += `</div>`;
        html += `<div style="font-size:0.75rem;color:var(--gold-dim);text-align:center;margin-top:4px;">${fateLevel.desc}</div>`;

        // 记忆碎片
        if (GameState.choiceLog.length > 0) {
          const lastChoice = GameState.choiceLog[GameState.choiceLog.length - 1];
          if (lastChoice && lastChoice.memory && memoryFragments[lastChoice.memory]) {
            const mem = memoryFragments[lastChoice.memory];
            html += `<div class="memory-card">`;
            html += `<div class="memory-card-title">💎 ${mem.title}</div>`;
            html += `<div class="memory-card-desc">${mem.description}</div>`;
            html += `</div>`;
          }
        }

        // 下一步按钮
        if (st.nextScene) {
          html += `<button class="next-btn" onclick="handleNext('${st.nextScene}')">${st.nextLabel || '继续'}</button>`;
        } else if (st.isChapterEnd) {
          html += `<button class="next-btn" style="opacity:0.6;cursor:default;">${st.nextLabel || '进入第二章（敬请期待）'}</button>`;
          html += `<div style="text-align:center;margin-top:16px;font-style:italic;color:var(--gold-dim);font-size:0.85rem;">`;
          html += `<p>第二章 · 失眠症</p>`;
          html += `<p style="margin-top:8px;">你将附身于奥雷里亚诺（或乌尔苏拉，或何塞本人），</p>`;
          html += `<p>经历那场让整个马孔多失去记忆的瘟疫。</p>`;
          html += `<p style="margin-top:8px;font-weight:600;color:var(--gold-light);">失眠症最可怕的不是无法入睡——</p>`;
          html += `<p style="font-weight:600;color:var(--gold-light);">而是忘记了你是谁。</p>`;
          html += `</div>`;
        }

        html += `</div>`;
      } else if (scene.type === 'narrative') {
        // 纯叙事（分支结果）——显示"继续"按钮
        html += `<div class="right-section-title">继续旅程</div>`;
        html += `<div style="text-align:center;padding:20px;">`;
        html += `<p style="color:var(--gold-dim);font-style:italic;margin-bottom:16px;">阅读完左页的叙事内容后，点击继续。</p>`;
        html += `<button class="next-btn" onclick="handleContinue()">继续 ▸</button>`;
        html += `</div>`;
      }

      rightPage.innerHTML = html;
      rightPage.scrollTop = 0;
      rightPage.classList.remove('fading');
    }, 300);
  },

  /* 更新顶部栏 */
  updateTopBar(scene) {
    const progressLabel = document.getElementById('progress-label');
    const fateValue = document.getElementById('fate-value');
    const fateDisplay = document.getElementById('fate-display');

    if (progressLabel) {
      if (scene.round === 0) {
        progressLabel.textContent = '序章';
      } else if (scene.round >= 1 && scene.round <= 5) {
        progressLabel.textContent = `第一章 · 第${scene.round}轮`;
      } else if (scene.round === 6) {
        progressLabel.textContent = '第一章 · 章末结算';
      }
    }

    if (fateValue) {
      const oldValue = parseInt(fateValue.textContent) || 0;
      const newValue = GameState.fateCounter;
      fateValue.textContent = newValue;

      // 颜色
      const fateLevel = GameState.getFateLevel();
      fateValue.style.color = fateLevel.color;

      // 跳动动画（仅当值改变时）
      if (oldValue !== newValue) {
        fateValue.classList.remove('pulse');
        void fateValue.offsetWidth; // 触发回流
        fateValue.classList.add('pulse');
      }
    }
  },

  /* 更新书签/进度指示 */
  updateBookmark() {
    // 预留：可在顶部栏显示进度条
  },

  /* 获取说话者CSS类 */
  _getSpeakerClass(speaker) {
    if (speaker.includes('乌尔苏拉')) return 'ursula';
    if (speaker.includes('何塞')) return 'jose';
    if (speaker.includes('梅尔基亚德斯')) return 'melquiades';
    return 'narrator';
  }
};

/* ================================================================
   七、全局事件处理函数
   ================================================================ */
function handleChoice(choiceId) {
  const result = GameEngine.selectChoice(choiceId);
  if (result) {
    // 先渲染分支叙事（左页）+ 继续按钮（右页）
    Renderer.render();
    // 检查是否解锁记忆碎片
    if (result.effects.memory) {
      setTimeout(() => {
        showToast(`💎 解锁记忆碎片：「${result.effects.memory}」`);
      }, 600);
    }
  }
}

function handleContinue() {
  const scene = GameEngine.getCurrentScene();
  if (scene && scene.type === 'narrative' && scene.nextScene) {
    GameEngine.goToScene(scene.nextScene);
    Renderer.render();
  }
}

function handleNext(nextSceneId) {
  GameEngine.goToScene(nextSceneId);
  Renderer.render();
}

/* ================================================================
   八、侧边栏管理
   ================================================================ */
const SidebarManager = {
  /* 家族树 */
  openFamilyTree() {
    const overlay = document.getElementById('sidebar-family-overlay');
    const panel = document.getElementById('sidebar-family');
    const content = document.getElementById('family-content');
    if (!overlay || !panel || !content) return;

    let html = '';
    familyTreeData.forEach((member, i) => {
      if (i > 0 && member.generation !== familyTreeData[i-1].generation) {
        html += '<div class="family-tree-connector"></div>';
      }
      html += `
        <div class="family-member ${member.isCurrent ? 'current' : ''}">
          <div class="fm-name">${member.isCurrent ? '► ' : ''}${member.name}</div>
          <div class="fm-relation">${member.relation} · 第${member.generation === 0 ? '外部' : member.generation + '代'}</div>
          <div style="font-size:0.72rem;color:#c0b090;margin-top:4px;line-height:1.4;">${member.description}</div>
        </div>`;
    });

    content.innerHTML = html;
    overlay.classList.add('open');
    panel.classList.add('open');
  },

  closeFamilyTree() {
    document.getElementById('sidebar-family-overlay').classList.remove('open');
    document.getElementById('sidebar-family').classList.remove('open');
  },

  /* 历史档案 */
  openArchives() {
    const overlay = document.getElementById('sidebar-archives-overlay');
    const panel = document.getElementById('sidebar-archives');
    const content = document.getElementById('archives-content');
    if (!overlay || !panel || !content) return;

    let html = '<div style="font-size:0.75rem;color:var(--gold-dim);margin-bottom:12px;">第一章 · 宿命之环</div>';

    // 显示所有记忆碎片
    const allMemories = Object.values(memoryFragments);
    allMemories.forEach(mem => {
      const unlocked = GameState.memories.includes(mem.id);
      html += `
        <div class="archive-item ${unlocked ? 'unlocked' : 'locked'}">
          <div class="archive-chapter">第一章</div>
          <div class="archive-title">${unlocked ? '💎 ' : ''}${mem.title}</div>
          <div class="archive-desc">${unlocked ? mem.description : '尚未解锁……做出不同的选择来发现这段记忆。'}</div>
        </div>`;
    });

    if (GameState.memories.length === 0) {
      html += '<div style="text-align:center;color:var(--gold-dim);padding:20px;font-style:italic;">尚未解锁任何记忆碎片。<br>在游戏中做出选择来收集它们。</div>';
    }

    content.innerHTML = html;
    overlay.classList.add('open');
    panel.classList.add('open');
  },

  closeArchives() {
    document.getElementById('sidebar-archives-overlay').classList.remove('open');
    document.getElementById('sidebar-archives').classList.remove('open');
  },

  /* 个人简介 */
  openProfile() {
    const overlay = document.getElementById('sidebar-profile-overlay');
    const panel = document.getElementById('sidebar-profile');
    const content = document.getElementById('profile-content');
    if (!overlay || !panel || !content) return;

    const fateLevel = GameState.getFateLevel();
    let html = '';

    // 状态概览
    html += '<div class="profile-section">';
    html += '<h4>当前状态</h4>';
    html += `<p class="profile-choice-log">附身角色：<strong>何塞·阿尔卡蒂奥·布恩迪亚</strong></p>`;
    html += `<p class="profile-choice-log">章节进度：第一章 · 第${Math.max(0, GameState.round)}轮</p>`;
    html += '</div>';

    // 宿命值
    html += '<div class="profile-section">';
    html += '<h4>宿命值</h4>';
    html += `<div class="profile-fate-level" style="color:${fateLevel.color};border:1px solid ${fateLevel.color};">`;
    html += `⭐ ${GameState.fateCounter} / 10 — ${fateLevel.level}`;
    html += `</div>`;
    html += `<p class="profile-choice-log" style="text-align:center;margin-top:6px;">${fateLevel.desc}</p>`;
    html += '</div>';

    // 已获得标签
    html += '<div class="profile-section">';
    html += '<h4>已获得标签</h4>';
    html += '<div class="profile-tags">';
    if (GameState.tags.length === 0) {
      html += '<span style="color:var(--gold-dim);font-style:italic;">暂无标签</span>';
    } else {
      GameState.tags.forEach(t => {
        html += `<span class="tag-badge">${t}</span>`;
      });
    }
    html += '</div></div>';

    // 选择记录
    html += '<div class="profile-section">';
    html += '<h4>选择记录</h4>';
    if (GameState.choiceLog.length === 0) {
      html += '<p class="profile-choice-log" style="color:var(--gold-dim);font-style:italic;">尚未做出选择。</p>';
    } else {
      GameState.choiceLog.forEach((log, i) => {
        html += `<p class="profile-choice-log">第${log.round}轮：<strong>${log.label}</strong> → ${log.tags.join('、')}</p>`;
      });
    }
    html += '</div>';

    content.innerHTML = html;
    overlay.classList.add('open');
    panel.classList.add('open');
  },

  closeProfile() {
    document.getElementById('sidebar-profile-overlay').classList.remove('open');
    document.getElementById('sidebar-profile').classList.remove('open');
  }
};

/* ================================================================
   九、设置面板
   ================================================================ */
const SettingsPanel = {
  fontSize: 'medium',
  volume: 30,
  sfx: true,

  open() {
    document.getElementById('settings-overlay').classList.add('open');
  },

  close() {
    document.getElementById('settings-overlay').classList.remove('open');
  },

  setFontSize(size) {
    this.fontSize = size;
    const body = document.body;
    const sizes = { small: '14px', medium: '17px', large: '20px' };
    const narrativeSizes = { small: '0.9rem', medium: '1.05rem', large: '1.2rem' };

    document.querySelectorAll('.font-size-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.size === size);
    });

    // 更新叙事段落字体
    document.querySelectorAll('.narrative-paragraph').forEach(el => {
      el.style.fontSize = narrativeSizes[size];
    });
    document.querySelectorAll('.narrative-quote').forEach(el => {
      el.style.fontSize = { small: '0.85rem', medium: '1rem', large: '1.15rem' }[size];
    });

    localStorage.setItem('settings_fontSize', size);
  },

  setVolume(val) {
    this.volume = val;
    localStorage.setItem('settings_volume', val);
  },

  toggleSfx() {
    this.sfx = !this.sfx;
    document.getElementById('toggle-sfx').classList.toggle('on', this.sfx);
    localStorage.setItem('settings_sfx', this.sfx);
  },

  loadSettings() {
    this.fontSize = localStorage.getItem('settings_fontSize') || 'medium';
    this.volume = parseInt(localStorage.getItem('settings_volume') || '30');
    this.sfx = localStorage.getItem('settings_sfx') !== 'false';

    this.setFontSize(this.fontSize);
    document.getElementById('volume-slider').value = this.volume;
    document.getElementById('toggle-sfx').classList.toggle('on', this.sfx);
  },

  resetGame() {
    if (confirm('确定要重置游戏吗？所有进度和存档将被清除，此操作不可撤销。')) {
      GameEngine.resetGame();
      StorageManager.clear();
      Renderer.render();
      this.close();
      showToast('游戏已重置');
    }
  }
};

/* ================================================================
   十、初始化
   ================================================================ */
function init() {
  // 加载设置
  SettingsPanel.loadSettings();

  // 尝试读档
  const hasSave = StorageManager.hasSave();
  if (hasSave) {
    const loaded = StorageManager.load();
    if (loaded) {
      console.log('已读取存档');
    }
  }

  // 渲染初始场景
  Renderer.render();

  // 设置按钮事件
  document.getElementById('btn-settings').addEventListener('click', () => SettingsPanel.open());
  document.getElementById('btn-close-settings').addEventListener('click', () => SettingsPanel.close());
  document.getElementById('settings-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) SettingsPanel.close();
  });

  // 字体大小按钮
  document.querySelectorAll('.font-size-btn').forEach(btn => {
    btn.addEventListener('click', () => SettingsPanel.setFontSize(btn.dataset.size));
  });

  // 音量滑块
  document.getElementById('volume-slider').addEventListener('input', (e) => {
    SettingsPanel.setVolume(parseInt(e.target.value));
  });

  // 音效开关
  document.getElementById('toggle-sfx').addEventListener('click', () => {
    SettingsPanel.toggleSfx();
  });

  // 重置游戏
  document.getElementById('btn-reset-game').addEventListener('click', () => SettingsPanel.resetGame());

  // 底部栏按钮
  document.getElementById('btn-save').addEventListener('click', () => {
    StorageManager.save();
    showToast('💾 存档成功');
  });

  document.getElementById('btn-load').addEventListener('click', () => {
    if (StorageManager.hasSave()) {
      const loaded = StorageManager.load();
      if (loaded) {
        Renderer.render();
        showToast('📂 读档成功');
      } else {
        showToast('❌ 读档失败');
      }
    } else {
      showToast('📂 没有找到存档');
    }
  });

  document.getElementById('btn-family-tree').addEventListener('click', () => SidebarManager.openFamilyTree());
  document.getElementById('btn-archives').addEventListener('click', () => SidebarManager.openArchives());
  document.getElementById('btn-profile').addEventListener('click', () => SidebarManager.openProfile());

  // 侧边栏关闭按钮
  document.getElementById('close-family').addEventListener('click', () => SidebarManager.closeFamilyTree());
  document.getElementById('close-archives').addEventListener('click', () => SidebarManager.closeArchives());
  document.getElementById('close-profile').addEventListener('click', () => SidebarManager.closeProfile());

  // 侧边栏遮罩点击关闭
  document.getElementById('sidebar-family-overlay').addEventListener('click', () => SidebarManager.closeFamilyTree());
  document.getElementById('sidebar-archives-overlay').addEventListener('click', () => SidebarManager.closeArchives());
  document.getElementById('sidebar-profile-overlay').addEventListener('click', () => SidebarManager.closeProfile());

  // 键盘导航
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      // 关闭所有侧边栏和设置
      SidebarManager.closeFamilyTree();
      SidebarManager.closeArchives();
      SidebarManager.closeProfile();
      SettingsPanel.close();
    }
    // 1/2/3 快捷选择
    if (e.key === '1' || e.key === '2' || e.key === '3') {
      const scene = GameEngine.getCurrentScene();
      if (scene && scene.type === 'choice' && scene.choices) {
        const idx = parseInt(e.key) - 1;
        if (scene.choices[idx]) {
          handleChoice(scene.choices[idx].id);
        }
      }
    }
  });

  console.log('《百年孤独 · 宿命之环》已就绪');
  console.log('按 1/2/3 键选择选项，按 Esc 关闭面板');
}

// 启动
document.addEventListener('DOMContentLoaded', init);
</script>
