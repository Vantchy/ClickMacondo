<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>百年孤独 · 宿命之环</title>
<!-- Google Fonts: 衬线字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   一、CSS变量 & 全局重置
   ================================================================ */
:root {
  /* 配色 —— 高对比度复古旧书质感 */
  --bg-dark: #080604;
  --page-bg: rgba(255, 250, 240, 0.90);
  --page-bg-strong: rgba(255, 250, 240, 0.96);
  --text-main: #1a0f08;
  --text-title: #402618;
  --text-transition: #5c4a3b;
  --speaker-ursula: #a52020;
  --speaker-jose: #1a3a4a;
  --speaker-melquiades: #c4910a;
  --speaker-narrator: #4a2a18;
  --choice-bg: #faf3e8;
  --choice-border: #b8956a;
  --choice-hover-bg: #ecdcc8;
  --choice-active-bg: #c89860;
  --fate-low: #4a7a4a;
  --fate-mid: #c4910a;
  --fate-high: #a51a1a;
  --gold: #b8893e;
  --gold-light: #e8c870;
  --gold-dim: #d4b070;
  --spine-shadow: rgba(0,0,0,0.18);
  --sidebar-text: #e0d2bc;
  --sidebar-text-dim: #c0b090;

  /* 字体 */
  --font-body: 'Cormorant Garamond', 'Noto Serif SC', 'Georgia', 'STSong', serif;
  --font-title: 'Cinzel', 'Noto Serif SC', 'Times New Roman', serif;
  --font-ui: 'Noto Serif SC', 'Georgia', serif;

  /* 尺寸 */
  --topbar-h: 48px;
  --bottombar-h: 56px;
  --book-padding: 40px;
  --spine-width: 4px;

  /* 过渡 */
  --transition-speed: 0.35s;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-dark);
  font-family: var(--font-body);
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  color: var(--text-main);
}

/* ================================================================
   二、书页背景层
   ================================================================ */
#book-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: #241c12;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(200,155,80,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(200,155,80,0.04) 0%, transparent 50%),
    url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="400" height="400" filter="url(%23n)" opacity="0.02"/></svg>');
  opacity: 1;
}

/* 书页纹理叠加 */
#book-texture {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139,105,20,0.02) 2px, rgba(139,105,20,0.02) 4px);
  opacity: 0.35;
}

/* 暗角 */
#vignette {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  box-shadow: inset 0 0 180px 60px rgba(0,0,0,0.55);
}

/* ================================================================
   三、主布局 — CSS Grid 书页
   ================================================================ */
#app-container {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
}

/* 顶部栏 */
#top-bar {
  height: var(--topbar-h);
  z-index: 15;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  background: linear-gradient(to bottom, rgba(10,8,4,0.9) 0%, rgba(10,8,4,0.4) 100%);
  gap: 12px;
  flex-shrink: 0;
  backdrop-filter: blur(6px);
}

.top-item {
  display: flex;
  align-items: center;
  gap: 16px;
}

.top-btn {
  font-family: var(--font-ui);
  font-size: 0.68rem;
  color: var(--gold-dim);
  background: rgba(10,8,4,0.55);
  border: 1px solid rgba(184,137,62,0.22);
  padding: 5px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.top-btn:hover {
  background: rgba(184,137,62,0.12);
  border-color: rgba(184,137,62,0.45);
  color: #e8d0a0;
}

#chapter-select {
  font-family: var(--font-ui);
  font-size: 0.68rem;
  color: var(--gold-dim);
  background: rgba(10,8,4,0.55);
  border: 1px solid rgba(184,137,62,0.22);
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  letter-spacing: 0.05em;
  outline: none;
}
#chapter-select option {
  background: #14100c;
  color: #d4b070;
}

#progress-label {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  color: var(--gold-dim);
  letter-spacing: 0.08em;
  white-space: nowrap;
}

/* 宿命值显示 */
#fate-display {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-title);
  font-size: 0.75rem;
  color: var(--gold-dim);
  letter-spacing: 0.1em;
}
#fate-icon {
  font-size: 1rem;
}
#fate-value {
  font-weight: 700;
  font-size: 1.1rem;
  transition: color 0.5s ease, transform 0.3s ease;
  min-width: 24px;
  text-align: center;
}
#fate-value.pulse {
  animation: fatePulse 0.5s ease;
}

@keyframes fatePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.35); }
}

/* 书页区域 */
#book-area {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr var(--spine-width) 1fr;
  overflow: hidden;
  min-height: 0;
}

/* 左页 */
#left-page {
  position: relative;
  padding: 32px 28px 32px 36px;
  overflow-y: auto;
  overflow-x: hidden;
  background:
    linear-gradient(to right, rgba(0,0,0,0.04) 0%, transparent 6%),
    linear-gradient(to left, rgba(0,0,0,0.03) 0%, transparent 3%),
    rgba(255, 250, 240, 0.88);
  transition: opacity var(--transition-speed) ease;
}
#left-page.fading { opacity: 0; }

#left-page::-webkit-scrollbar { width: 4px; }
#left-page::-webkit-scrollbar-track { background: transparent; }
#left-page::-webkit-scrollbar-thumb { background: rgba(139,105,20,0.15); border-radius: 6px; }

/* 书脊 */
#spine {
  position: relative;
  background: linear-gradient(
    to right,
    rgba(0,0,0,0.12) 0%,
    rgba(0,0,0,0.18) 30%,
    rgba(0,0,0,0.22) 50%,
    rgba(0,0,0,0.18) 70%,
    rgba(0,0,0,0.12) 100%
  );
  box-shadow:
    -2px 0 8px rgba(0,0,0,0.1),
    2px 0 8px rgba(0,0,0,0.1);
  z-index: 2;
}

/* 右页 */
#right-page {
  position: relative;
  padding: 32px 36px 32px 28px;
  overflow-y: auto;
  overflow-x: hidden;
  background:
    linear-gradient(to left, rgba(0,0,0,0.04) 0%, transparent 6%),
    linear-gradient(to right, rgba(0,0,0,0.03) 0%, transparent 3%),
    rgba(255, 250, 240, 0.88);
  transition: opacity var(--transition-speed) ease;
}
#right-page.fading { opacity: 0; }

#right-page::-webkit-scrollbar { width: 4px; }
#right-page::-webkit-scrollbar-track { background: transparent; }
#right-page::-webkit-scrollbar-thumb { background: rgba(139,105,20,0.15); border-radius: 6px; }

/* 底部栏 */
#bottom-bar {
  height: var(--bottombar-h);
  z-index: 15;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 8px 20px 14px;
  background: linear-gradient(to top, rgba(10,8,4,0.9) 0%, rgba(10,8,4,0.4) 100%);
  backdrop-filter: blur(6px);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.bottom-btn {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  color: var(--gold-dim);
  background: rgba(10,8,4,0.55);
  border: 1px solid rgba(184,137,62,0.2);
  padding: 6px 16px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 0.06em;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
}
.bottom-btn:hover {
  background: rgba(184,137,62,0.12);
  border-color: rgba(184,137,62,0.45);
  color: #e8d0a0;
}

/* ================================================================
   四、左页叙事区样式
   ================================================================ */
.scene-title {
  font-family: var(--font-title);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-title);
  letter-spacing: 0.1em;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(196,149,74,0.2);
  text-align: center;
}

.speaker-label {
  display: inline-block;
  font-family: var(--font-title);
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}
.speaker-label.ursula { color: var(--speaker-ursula); }
.speaker-label.jose { color: var(--speaker-jose); }
.speaker-label.melquiades { color: var(--speaker-melquiades); }
.speaker-label.narrator { color: var(--speaker-narrator); }

.narrative-paragraph {
  font-size: 1.05rem;
  line-height: 1.9;
  color: var(--text-main);
  text-indent: 2em;
  margin-bottom: 14px;
  text-align: justify;
  letter-spacing: 0.01em;
}

.narrative-quote {
  display: block;
  margin: 8px 0 14px 16px;
  padding: 8px 16px;
  border-left: 2px solid var(--gold);
  font-style: italic;
  color: #3a2518;
  font-size: 1rem;
  line-height: 1.8;
  background: rgba(196,149,74,0.08);
}

.transition-text {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px dashed rgba(139,105,20,0.15);
  font-style: italic;
  color: var(--text-transition);
  font-size: 0.95rem;
  line-height: 1.7;
  text-align: center;
}

.memory-hint {
  margin-top: 20px;
  padding: 10px 16px;
  background: rgba(196,149,74,0.1);
  border: 1px solid rgba(184,137,62,0.25);
  border-radius: 6px;
  font-size: 0.8rem;
  color: #5c4a3b;
  text-align: center;
  font-style: italic;
}
.memory-hint::before {
  content: '💎 ';
}

/* ================================================================
   五、右页交互区样式
   ================================================================ */
.right-section-title {
  font-family: var(--font-title);
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-title);
  text-align: center;
  margin-bottom: 20px;
  letter-spacing: 0.08em;
}

.choices-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.choice-btn {
  display: block;
  width: 100%;
  padding: 18px 22px;
  background: rgba(250, 243, 232, 0.94);
  border: 1px solid var(--choice-border);
  border-radius: 6px;
  font-family: var(--font-body);
  font-size: 1.05rem;
  text-align: left;
  color: var(--text-main);
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  letter-spacing: 0.02em;
}
.choice-btn:hover {
  background: var(--choice-hover-bg);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.14);
  border-color: #a07848;
}
.choice-btn:active {
  background: var(--choice-active-bg);
  transform: translateY(0);
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.choice-btn .choice-label {
  display: block;
  font-weight: 600;
  font-family: var(--font-title);
  font-size: 1rem;
  color: var(--text-title);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
}
.choice-btn .choice-desc {
  display: block;
  font-size: 0.88rem;
  color: #4a3a2a;
  line-height: 1.5;
  font-style: italic;
}

/* 结算面板 */
.settlement-panel {
  background: rgba(250, 243, 232, 0.94);
  border: 1px solid var(--choice-border);
  border-radius: 8px;
  padding: 24px;
}

.settlement-summary {
  font-size: 0.95rem;
  line-height: 1.8;
  color: var(--text-main);
  text-align: center;
  margin-bottom: 16px;
  font-style: italic;
}

.settlement-table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 0.88rem;
}
.settlement-table th {
  font-family: var(--font-title);
  font-size: 0.75rem;
  color: var(--text-title);
  padding: 8px 10px;
  border-bottom: 1px solid var(--choice-border);
  letter-spacing: 0.05em;
}
.settlement-table td {
  padding: 8px 10px;
  text-align: center;
  border-bottom: 1px solid rgba(196,149,74,0.12);
  color: var(--text-main);
}

.tag-badge {
  display: inline-block;
  padding: 3px 12px;
  background: rgba(184,137,62,0.15);
  border: 1px solid rgba(184,137,62,0.3);
  border-radius: 12px;
  font-size: 0.75rem;
  color: #3a2018;
  margin: 2px 4px;
}

.profile-tags .tag-badge {
  color: #e0d8d2;
  font-weight: 600;
}

.fate-summary {
  text-align: center;
  font-family: var(--font-title);
  font-size: 0.9rem;
  margin-top: 16px;
  letter-spacing: 0.06em;
}

.next-btn {
  display: block;
  width: 80%;
  margin: 20px auto 0;
  padding: 14px 24px;
  background: linear-gradient(135deg, rgba(184,137,62,0.22), rgba(184,137,62,0.1));
  border: 1px solid var(--gold);
  border-radius: 30px;
  font-family: var(--font-title);
  font-size: 0.95rem;
  color: #9a7030;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 0.1em;
  text-align: center;
}
.next-btn:hover {
  background: linear-gradient(135deg, rgba(184,137,62,0.38), rgba(184,137,62,0.18));
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(184,137,62,0.2);
  color: #b8893e;
}

/* 记忆碎片卡片 修复蓝白色冰低对比度问题 */
.memory-card {
  position: relative;
  margin-top: 16px;
  padding: 16px 20px;
  /* 原淡蓝冷渐变加深、弱化透光白雾 */
  background: linear-gradient(135deg, rgba(184,137,0.18), rgba(8,6,4,0.65));
  border: 1px solid var(--gold);
  border-radius: 8px;
  animation: memorySlideIn 0.5s ease;
  box-shadow: 0 0 16px rgba(184,137,62,0.12);
}
@keyframes memorySlideIn {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.memory-card-title {
  font-family: var(--font-title);
  font-size: 0.85rem;
  color: var(--gold-light);
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  font-weight: 600; /* 加粗提升醒目度 */
}
.memory-card-desc {
  font-size: 0.82rem;
  color: #c8b290; /* 原#d4c0a0加深，解决淡字看不清 */
  line-height: 1.6;
  font-style: italic;
}


/* ================================================================
   六、侧边栏（通用）
   ================================================================ */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0,0,0,0.6);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
.sidebar-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.sidebar-panel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(420px, 90vw);
  z-index: 55;
  background: linear-gradient(135deg, #14100c, #0e0b08);
  border-left: 1px solid rgba(184,137,62,0.2);
  box-shadow: -8px 0 30px rgba(0,0,0,0.6);
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
}
.sidebar-panel.open {
  transform: translateX(0);
}

.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(184,137,62,0.2);
}
.sidebar-title {
  font-family: var(--font-title);
  font-size: 1.1rem;
  color: var(--gold-light);
  letter-spacing: 0.08em;
}
.sidebar-close {
  background: none;
  border: 1px solid rgba(184,137,62,0.3);
  color: var(--gold-dim);
  font-size: 1.2rem;
  cursor: pointer;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}
.sidebar-close:hover {
  background: rgba(184,137,62,0.15);
  border-color: var(--gold);
  color: var(--gold-light);
}

.sidebar-content {
  flex: 1;
  overflow-y: auto;
}

/* 家族树 */
.family-member {
  padding: 10px 14px;
  margin: 6px 0;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(184,137,62,0.15);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.family-member:hover {
  background: rgba(184,137,62,0.1);
  border-color: rgba(184,137,62,0.35);
}
.family-member.current {
  border-color: var(--gold);
  background: rgba(184,137,62,0.15);
}
.family-member .fm-name {
  font-family: var(--font-title);
  font-size: 0.9rem;
  color: #e8d0a0;
  letter-spacing: 0.04em;
}
.family-member .fm-relation {
  font-size: 0.7rem;
  color: var(--gold-dim);
  margin-top: 2px;
}
.family-tree-connector {
  width: 2px;
  height: 16px;
  background: rgba(184,137,62,0.18);
  margin: 0 auto;
}

/* 历史档案 */
.archive-item {
  padding: 12px 16px;
  margin: 8px 0;
  border-radius: 6px;
  border: 1px solid rgba(184,137,62,0.15);
  background: rgba(255,255,255,0.03);
  transition: all 0.3s ease;
}
.archive-item.unlocked { border-color: rgba(184,137,62,0.35); }
.archive-item.locked {
  opacity: 0.45;
  filter: grayscale(0.4);
}
.archive-item .archive-chapter {
  font-size: 0.65rem;
  color: var(--gold-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.archive-item .archive-title {
  font-family: var(--font-title);
  font-size: 0.9rem;
  color: #e8d0a0;
  margin-top: 2px;
  letter-spacing: 0.04em;
}
.archive-item .archive-desc {
  font-size: 0.8rem;
  color: #c0b090;
  margin-top: 4px;
  line-height: 1.4;
}
.locked .archive-title::after {
  content: ' ❓';
}

/* 个人简介 */
.profile-section {
  margin-bottom: 20px;
}
.profile-section h4 {
  font-family: var(--font-title);
  font-size: 0.8rem;
  color: var(--gold-light);
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(184,137,62,0.18);
}
.profile-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.profile-choice-log {
  font-size: 0.82rem;
  color: #d0c0a0;
  line-height: 1.8;
}
.profile-fate-level {
  font-family: var(--font-title);
  font-size: 1.1rem;
  text-align: center;
  padding: 12px;
  background: rgba(184,137,62,0.08);
  border-radius: 8px;
  margin-top: 8px;
}

/* ================================================================
   七、设置面板（模态框）
   ================================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal-panel {
  background: linear-gradient(135deg, #181410, #12100c);
  border: 1px solid rgba(184,137,62,0.25);
  border-radius: 12px;
  padding: 28px 32px;
  width: min(380px, 90vw);
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
}

.modal-title {
  font-family: var(--font-title);
  font-size: 1rem;
  color: #e8d0a0;

/** 注册一个章节的数据 */
function registerChapter(data) {
  chapters[data.id] = data;
  // 合并记忆碎片
  if (data.memories) {
    Object.assign(memoryRegistry, data.memories);
  }
  // 合并家族成员
  if (data.familyMembers) {
    data.familyMembers.forEach(m => {
      if (!familyTreeRegistry[m.name]) {
        familyTreeRegistry[m.name] = { ...m, firstAppearedIn: data.id };
      }
    });
  }
}

/** 获取当前章节数据 */
function getCurrentChapterData() {
  if (GameState.chapter === 0) return chapters['prologue'] || null;
  return chapters['chapter' + GameState.chapter] || null;
}

/** 计算当前章节宿命值上限（所有选择中最高宿命之和） */
function getChapterMaxFate() {
  const chData = getCurrentChapterData();
  if (!chData || !chData.scenes) return 10;
  let maxFate = 0;
  Object.values(chData.scenes).forEach(scene => {
    if (scene.type === 'choice' && scene.choices) {
      let roundMax = 0;
      scene.choices.forEach(c => {
        if (c.effects && c.effects.fate) {
          roundMax = Math.max(roundMax, c.effects.fate);
        }
      });
      maxFate += roundMax;
    }
  });
  return maxFate || 10; // 兜底：至少10
}

/** 获取当前章节中所有记忆碎片 */
function getCurrentChapterMemories() {
  const chData = getCurrentChapterData();

function findRelation(name1, name2) {
  const a = resolveCharacterName(name1);
  const b = resolveCharacterName(name2);
  for (const [ra, rb, label, event] of RELATION_DB) {
    if ((ra === a && rb === b) || (ra === b && rb === a)) {
      return [label, event];
    }
  }
  return null;
}

function findRelationPath(name1, name2) {
  const a = resolveCharacterName(name1);
  const b = resolveCharacterName(name2);
  if (a === b) return null;
  const graph = {};
  for (const [ra, rb, label] of RELATION_DB) {
    if (!graph[ra]) graph[ra] = [];
    if (!graph[rb]) graph[rb] = [];
    graph[ra].push({ to: rb, label });
    graph[rb].push({ to: ra, label });
  }
  if (!graph[a] || !graph[b]) return null;
  const visited = new Set([a]);
  const queue = [[a, []]];
  while (queue.length > 0) {
    const [current, edges] = queue.shift();
    if (current === b) return edges;
    for (const { to, label } of (graph[current] || [])) {
      if (!visited.has(to)) {
        visited.add(to);
        queue.push([to, [...edges, { from: current, to, label }]]);
      }
    }
  }
  return null;
}

/** 获取章节显示标题（如 "第一章 · 宿命之环"） */
function getChapterDisplayTitle(chapterId) {
  const meta = CHAPTER_META[chapterId];
  const chData = chapters[chapterId];
  if (chData) return chData.title;
  if (meta) return meta.shortName + (meta.subtitle ? ' · ' + meta.subtitle : '');
  return chapterId;
}
/** 动态生成章节下拉菜单 — 显示所有已知章节，已注册数据的可用 */
function populateChapterSelect() {
  const select = document.getElementById('chapter-select');
  if (!select) return;

  select.innerHTML = '';
  const currentChNum = GameState.chapter;

  CHAPTER_ORDER.forEach(chId => {
    const meta = CHAPTER_META[chId];
    if (!meta) return;
    const chData = chapters[chId]; // 可能为 null（尚未注册数据）
    const displayTitle = getChapterDisplayTitle(chId);
    const chNum = meta.num;

    const option = document.createElement('option');
    option.value = chNum;
    option.dataset.chapterId = chId;
    option.textContent = displayTitle;

    // 判断章节状态
    const isRegistered = !!chData;
    const isCompleted = GameState.isChapterCompleted(chNum);
    const isCurrent = (chNum === currentChNum);
    const isNext = (chNum === currentChNum + 1);

    // 未注册数据的章节禁用
    if (!isRegistered) {
      option.disabled = true;
      option.textContent += '（敬请期待）';
    }
    // 已完成的章节（可查看）
    else if (isCompleted && !isCurrent) {
      option.textContent += ' ✓';
    }
    // 未到达且未完成的章节全部锁定（包括紧邻下一章）
    else if (!isCurrent && !isCompleted) {
      option.disabled = true;
      option.textContent += ' 🔒';
    }

    if (isCurrent) {
      option.selected = true;
    }

    select.appendChild(option);
  });

  // 切换章节事件（只绑定一次）
  if (!select._chapterListenerAttached) {
    select._chapterListenerAttached = true;
    select.addEventListener('change', function(e) {
      const targetChapter = parseInt(e.target.value);
      if (targetChapter !== GameState.chapter) {
        if (GameEngine.switchToChapter(targetChapter)) {
          Renderer.render();
          const chData = getCurrentChapterData();
          const chMeta = CHAPTER_META['chapter' + targetChapter] || CHAPTER_META['prologue'];
          const targetChId = targetChapter === 0 ? 'prologue' : 'chapter' + targetChapter;
          const targetChData = chapters[targetChId];
          const isViewing = GameState.isChapterCompleted(targetChapter) && targetChapter < currentChNum;
          if (isViewing) {
            showToast('📖 正在查看 ' + (targetChData ? targetChData.title : '第' + targetChapter + '章') + ' 的结算数据');
          } else {
            showToast('已跳转至 ' + (targetChData ? targetChData.title : '第' + targetChapter + '章'));
          }
          populateChapterSelect();
        }
      }
    });
  }
}

    return !!this.completedChapters[chapterNum];
  },

  getFateLevel() {
    const f = this.fateCounter;
    const maxF = getChapterMaxFate();
    const low = Math.ceil(maxF / 3);
    const mid = Math.ceil(maxF * 2 / 3);
    if (f <= low) return { level: '宿命抗争者', color: 'var(--fate-low)', desc: '你还在与命运搏斗。你相信自己可以改变方向。' };
    if (f <= mid) return { level: '宿命追随者', color: 'var(--fate-mid)', desc: '你开始听见命运的低语。你偶尔会在夜里惊醒，感觉一切都已经被写好了。' };
    return { level: '宿命见证者', color: 'var(--fate-high)', desc: '你已经知道答案了。你只是还在走着看。' };
  },

  toJSON() {
    return {
      currentScene: this.currentScene,
      chapter: this.chapter,
      round: this.round,
      tags: [...this.tags],
      fateCounter: this.fateCounter,
      antiFateCounter: this.antiFateCounter,
      memories: [...this.memories],
      history: [...this.history],
      choices: [...this.choices],
      choiceLog: [...this.choiceLog],
      completedChapters: {...this.completedChapters},
      encounteredCharacters: [...this.encounteredCharacters]
    };
  },

  fromJSON(data) {
    this.currentScene = data.currentScene;
    this.chapter = data.chapter;
    this.round = data.round;
    this.tags = data.tags || [];
    this.fateCounter = data.fateCounter || 0;
    this.antiFateCounter = data.antiFateCounter || 0;
    this.memories = data.memories || [];
    this.history = data.history || [];
    this.choices = data.choices || [];
    this.choiceLog = data.choiceLog || [];
    this.completedChapters = data.completedChapters || {};
    this.encounteredCharacters = data.encounteredCharacters || [];
  }
};

/* ================================================================
   三、游戏引擎
   ================================================================ */
const GameEngine = {
  selectChoice(choiceId) {
    const scene = this.getCurrentScene();
    if (!scene || scene.type !== 'choice') return null;

    const choice = scene.choices.find(c => c.id === choiceId);
    if (!choice) return null;

    // 记录选择
    GameState.choices.push(choiceId);
    GameState.choiceLog.push({
      round: scene.round,
      choiceId: choiceId,
      label: choice.label,
      tags: choice.effects.tags,
      fate: choice.effects.fate,
      memory: choice.effects.memory,
      targetChapter: choice.effects.targetChapter || null
    });

    // 应用效果
    if (choice.effects.tags) {
      choice.effects.tags.forEach(t => {
        if (!GameState.tags.includes(t)) GameState.tags.push(t);
      });
    }

    if (choice.effects.fate) {
      if (choice.effects.antiFate) {
        GameState.antiFateCounter += choice.effects.fate;
      } else {
        GameState.fateCounter += choice.effects.fate;
      }
      // 限制宿命值不超过本章节最大值
      const chMaxFate = getChapterMaxFate();
      GameState.fateCounter = Math.min(chMaxFate, Math.max(0, GameState.fateCounter));
    }

    if (choice.effects.memory && !GameState.memories.includes(choice.effects.memory)) {
      GameState.memories.push(choice.effects.memory);
    }

    // 序章时代选择的targetChapter存储在choiceLog中——不在这里改变GameState.chapter
    // goToNextChapter()会检查choiceLog中的targetChapter

    // 先跳转到分支叙事
    const nextSceneId = choice.nextScene;
    GameState.history.push(nextSceneId);
    GameState.currentScene = nextSceneId;
    GameState.round = scene.round;

    // 自动存档
    StorageManager.autoSave();

    return choice;
  },

  goToScene(sceneId) {
    GameState.history.push(sceneId);
    GameState.currentScene = sceneId;
    const chapterData = getCurrentChapterData();
    const scene = chapterData ? chapterData.scenes[sceneId] : null;
    if (scene) {
      GameState.round = scene.round || GameState.round;
    }
    StorageManager.autoSave();
  },

  getCurrentScene() {
    const chapterData = getCurrentChapterData();
    return chapterData ? chapterData.scenes[GameState.currentScene] || null : null;
  },

  goToSettlement() {
    const scene = this.getCurrentScene();
    // 找到当前回合的结算场景
    if (scene && scene.type === 'narrative' && scene.nextScene) {
      this.goToScene(scene.nextScene);
    }
  },

  getChapterEndScene() {
    const chapterData = getCurrentChapterData();
    return chapterData ? chapterData.scenes[chapterData.id + '_end'] : null;
  },

  /** 切换到指定章节（用于章节选择器跳转） */
  switchToChapter(chapterNum) {
    const chapterId = chapterNum === 0 ? 'prologue' : 'chapter' + chapterNum;
    const chapterData = chapters[chapterId];
    if (!chapterData) return false;

    // 如果不是当前章节，需要检查权限
    if (chapterNum !== GameState.chapter) {
      // 序章（chapter 0）可以选择跳转到任何时代
      const isFromPrologue = (GameState.chapter === 0);

      // 已完成章节 → 进入查看模式（跳到章末结算）
      if (GameState.isChapterCompleted(chapterNum) && chapterNum < GameState.chapter) {
        GameState.chapter = chapterNum;
        const endScene = chapterData.scenes[chapterData.id + '_end'];
        if (endScene) {
          GameState.currentScene = chapterData.id + '_end';
          GameState.round = endScene.round || 99;
          GameState.history = [chapterData.id + '_end'];
          StorageManager.autoSave();
          return true;
        }
        GameState.currentScene = chapterData.initialScene;
        GameState.round = 0;
        GameState.history = [chapterData.initialScene];
        StorageManager.autoSave();
        return true;
      }

      // 序章跳转：允许跳转到时代选择的目标章节
      if (isFromPrologue) {
        GameState.chapter = chapterNum;
        GameState.currentScene = chapterData.initialScene;
        GameState.round = 0;
        GameState.history = [chapterData.initialScene];
        GameState.choices = [];
        GameState.choiceLog = [];
        GameState.fateCounter = 0;
        GameState.antiFateCounter = 0;
        StorageManager.autoSave();
        this.encounterChapterMembers();
        return true;
      }

      // 前进到紧邻的下一章（仅当当前章节已完成）
      if (chapterNum === GameState.chapter + 1 && GameState.isChapterCompleted(GameState.chapter)) {
        GameState.chapter = chapterNum;
        GameState.currentScene = chapterData.initialScene;
        GameState.round = 0;
        GameState.history = [chapterData.initialScene];
        GameState.choices = [];
        GameState.choiceLog = [];
        GameState.fateCounter = 0;
        GameState.antiFateCounter = 0;
        StorageManager.autoSave();
        this.encounterChapterMembers();
        return true;
      }

      // 其他情况：锁定
      if (!GameState.isChapterCompleted(chapterNum) && chapterNum > GameState.chapter) {
        showToast('🔒 请先完成当前章节再来探索这里');
        return false;
      }
    }

    // 同一章节，允许切换
    GameState.chapter = chapterNum;
    GameState.currentScene = chapterData.initialScene;
    GameState.round = 0;
    GameState.history = [chapterData.initialScene];
    GameState.choices = [];
    GameState.choiceLog = [];
    StorageManager.autoSave();
    return true;
  },

  /** 进入下一章 */
  goToNextChapter() {
    // 标记当前章节完成
    GameState.markChapterCompleted(GameState.chapter);
    // 检查是否有待处理的targetChapter（序章时代选择）
    const lastChoice = GameState.choiceLog.length > 0 ? GameState.choiceLog[GameState.choiceLog.length - 1] : null;
    const nextChapter = (lastChoice && lastChoice.targetChapter) ? lastChoice.targetChapter : GameState.chapter + 1;
    return this.switchToChapter(nextChapter);
  },

  /** 遇到当前章节的家族成员（包括附身角色和场景中出现的说话者） */
  encounterChapterMembers() {
    const chData = getCurrentChapterData();
    if (!chData) return;
    const newEncounters = [];

    // 1. 附身角色 — 同时匹配注册表中的全名
    if (chData.possessedCharacter) {
      const possessed = chData.possessedCharacter;
      const registryNames = Object.keys(familyTreeRegistry);
      const matchedName = registryNames.find(rn =>
        rn === possessed || rn.includes(possessed) || possessed.includes(rn)
      );
      const nameToEncounter = matchedName || possessed;
      if (GameState.encounterCharacter(nameToEncounter)) {
        newEncounters.push(nameToEncounter);
      }
      // 如果匹配到了不同名，也把原名记上（避免重复扫描时遗漏）
      if (matchedName && matchedName !== possessed && GameState.encounterCharacter(possessed)) {
        // already tracked
      }
    }

    // 2. 注册的家庭成员
    if (chData.familyMembers) {
      chData.familyMembers.forEach(m => {
        if (GameState.encounterCharacter(m.name)) {
          newEncounters.push(m.name);
        }
      });
    }

    // 3. 扫描所有场景中的说话者（leftPage.speaker），匹配家族树注册表
    if (chData.scenes) {
      const registryNames = Object.keys(familyTreeRegistry);
      Object.values(chData.scenes).forEach(scene => {
        if (scene.leftPage && scene.leftPage.speaker) {
          const speaker = scene.leftPage.speaker;
          if (speaker === '旁白') return;
          // 查找所有匹配项
          const matches = registryNames.filter(rn =>
            rn === speaker || rn.includes(speaker) || speaker.includes(rn)
          );
          let matchedName = null;
          if (matches.length === 1) {
            matchedName = matches[0];
          } else if (matches.length > 1) {
            // 歧义消解：根据章节选择正确的人物
            // '奥雷里亚诺'：第1-7章指上校(gen2)，第15-20章指私生子(gen6)
            matchedName = matches.find(rn => {
              const gen = familyTreeRegistry[rn].generation;
              if (chData.chapterNumber <= 7 && gen === 2) return true;
              if (chData.chapterNumber >= 15 && gen === 6) return true;
              return false;
            });
            if (!matchedName) matchedName = matches[0]; // fallback
          }
          if (matchedName && GameState.encounterCharacter(matchedName)) {
            if (!newEncounters.includes(matchedName)) {
              newEncounters.push(matchedName);
            }
          }
        }
      });
    }

    // 批量通知
    if (newEncounters.length > 0) {
      setTimeout(() => {
        if (newEncounters.length === 1) {
          showToast('🌳 ' + newEncounters[0] + ' 已加入家族树');
        } else {
          showToast('🌳 ' + newEncounters.length + ' 位人物已加入家族树');
        }
      }, 800);
    }
  },

  /** 从序章跳转到指定章节 */
  jumpToChapterFromPrologue(chapterNum) {
    GameState.markChapterCompleted(0);
    GameState.chapter = chapterNum;
    const chapterId = 'chapter' + chapterNum;
    const chapterData = chapters[chapterId];
    if (!chapterData) return false;
    GameState.currentScene = chapterData.initialScene;
    GameState.round = 0;
    GameState.history = [chapterData.initialScene];
    GameState.choices = [];
    GameState.choiceLog = [];
    StorageManager.autoSave();
    return true;
  },

  resetGame() {
    GameState.reset();
    StorageManager.clearAll();
  }
};

/* ================================================================
   四、存档/读档工具 — 6个手动槽位 + 独立自动存档
   ================================================================ */
const StorageManager = {
  AUTO_KEY: 'cien_anos_autosave',
  SLOT_PREFIX: 'cien_anos_slot_',
  MAX_SLOTS: 6,

  /** 自动存档（每次选择/场景跳转后自动调用） */
  autoSave() {
    try {
      const data = GameState.toJSON();
      localStorage.setItem(this.AUTO_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      console.warn('自动存档失败:', e);
      return false;
    }
  },

  /** 自动读档（页面初始化时调用） */
  autoLoad() {
    try {
      const raw = localStorage.getItem(this.AUTO_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      GameState.fromJSON(data);
      return true;
    } catch (e) {
      console.warn('自动读档失败:', e);
      return false;
    }
  },

  hasAutoSave() {
    return localStorage.getItem(this.AUTO_KEY) !== null;
  },

  /** 保存到指定槽位 (1-6) */
  saveToSlot(slotNum) {
    if (slotNum < 1 || slotNum > this.MAX_SLOTS) return false;
    try {
      const scene = GameEngine.getCurrentScene();
      const chData = getCurrentChapterData();
      const saveData = {
        state: GameState.toJSON(),
        meta: {
          timestamp: new Date().toLocaleString('zh-CN', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit'
          }),
          chapterTitle: chData ? chData.title : '未知章节',
          chapter: GameState.chapter,
          round: GameState.round,
          sceneTitle: scene ? (scene.title || '未知场景') : '未知场景',
          sceneId: GameState.currentScene,
          fateCounter: GameState.fateCounter
        }
      };
      localStorage.setItem(this.SLOT_PREFIX + slotNum, JSON.stringify(saveData));
      return true;
    } catch (e) {
      console.warn('存档到槽位' + slotNum + '失败:', e);
      return false;
    }
  },

  /** 从指定槽位读取 (1-6) */
  loadFromSlot(slotNum) {
    if (slotNum < 1 || slotNum > this.MAX_SLOTS) return false;
    try {
      const raw = localStorage.getItem(this.SLOT_PREFIX + slotNum);
      if (!raw) return false;
      const saveData = JSON.parse(raw);
      GameState.fromJSON(saveData.state);
      return true;
    } catch (e) {
      console.warn('从槽位' + slotNum + '读档失败:', e);
      return false;
    }
  },

  /** 获取槽位元信息（null 表示空槽位） */
  getSlotInfo(slotNum) {
    if (slotNum < 1 || slotNum > this.MAX_SLOTS) return null;
    try {
      const raw = localStorage.getItem(this.SLOT_PREFIX + slotNum);
      if (!raw) return null;
      const saveData = JSON.parse(raw);
      return saveData.meta || null;
    } catch (e) {
      return null;
    }
  },

  /** 删除指定槽位 */
  deleteSlot(slotNum) {
    if (slotNum < 1 || slotNum > this.MAX_SLOTS) return;
    localStorage.removeItem(this.SLOT_PREFIX + slotNum);
  },

  /** 清除所有存档（自动存档 + 6个槽位） */
  clearAll() {
    localStorage.removeItem(this.AUTO_KEY);
    for (let i = 1; i <= this.MAX_SLOTS; i++) {
      localStorage.removeItem(this.SLOT_PREFIX + i);
    }
  }
};

/* ================================================================
   五、Toast 提示
   ================================================================ */
let toastTimer = null;
function showToast(msg, duration = 2000) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, duration);
}

/* ================================================================
   六、主渲染器
   ================================================================ */
const Renderer = {
  /* 渲染整个页面 */
  render() {
    const scene = GameEngine.getCurrentScene();
    if (!scene) return;
    this.renderLeftPage(scene);
    this.renderRightPage(scene);
    this.updateTopBar(scene);
    this.updateBookmark();
  },

  /* 渲染左页（叙事区） */
  renderLeftPage(scene) {
    const leftPage = document.getElementById('left-page');
    if (!leftPage) return;

    // 淡出
    leftPage.classList.add('fading');

    setTimeout(() => {
      let html = '';
      const lp = scene.leftPage;

      // 场景标题
      if (scene.title) {
        html += `<div class="scene-title">${scene.title}</div>`;
      }

      // 说话者
      if (lp.speaker) {
        const colorClass = this._getSpeakerClass(lp.speaker);
        html += `<div class="speaker-label ${colorClass}" style="color: ${lp.speakerColor || ''}">${lp.speaker}：</div>`;
      }

      // 正文段落
      if (lp.paragraphs) {
        lp.paragraphs.forEach(p => {
          html += `<p class="narrative-paragraph">${p}</p>`;
        });
      }

      // 引用1
      if (lp.quotes) {
        lp.quotes.forEach(q => {
          html += `<span class="narrative-quote">${q}</span>`;
        });
      }

      // 引用后正文
      if (lp.postQuote) {
        lp.postQuote.forEach(p => {
          html += `<p class="narrative-paragraph">${p}</p>`;
        });
      }

      // 引用2
      if (lp.quotes2) {
        lp.quotes2.forEach(q => {
          html += `<span class="narrative-quote">${q}</span>`;
        });
      }

      // 引用2后正文
      if (lp.postQuote2) {
        lp.postQuote2.forEach(p => {
          html += `<p class="narrative-paragraph">${p}</p>`;
        });
      }

      // 过渡文字
      if (lp.transition) {
        html += `<div class="transition-text">${lp.transition}</div>`;
      }

      leftPage.innerHTML = html;
      leftPage.scrollTop = 0;
      leftPage.classList.remove('fading');
    }, 300);
  },

  /* 渲染右页（交互区） */
  renderRightPage(scene) {
    const rightPage = document.getElementById('right-page');
    if (!rightPage) return;

    rightPage.classList.add('fading');

    setTimeout(() => {
      let html = '';

      if (scene.type === 'choice' && scene.choices) {
        // 选项模式
        html += `<div class="right-section-title">做出你的选择</div>`;
        html += `<div class="choices-list">`;
        scene.choices.forEach(choice => {
          html += `
            <button class="choice-btn" data-choice-id="${choice.id}" onclick="handleChoice('${choice.id}')">
              <span class="choice-label">${choice.label}</span>
              <span class="choice-desc">${choice.description}</span>
            </button>`;
        });
        html += `</div>`;
      } else if (scene.type === 'settlement' && scene.settlement) {
        // 结算模式
        const st = scene.settlement;
        html += `<div class="right-section-title">📋 结算</div>`;
        html += `<div class="settlement-panel">`;

        if (st.summary) {
          html += `<div class="settlement-summary">${st.summary}</div>`;
        }

        // 显示本轮获得的标签
        if (GameState.choiceLog.length > 0) {
          const lastChoice = GameState.choiceLog[GameState.choiceLog.length - 1];
          if (lastChoice && lastChoice.tags.length > 0) {
            html += `<div style="text-align:center;margin:12px 0;">`;
            html += `<div style="font-size:0.75rem;color:var(--gold-dim);margin-bottom:6px;">获得标签：</div>`;
            lastChoice.tags.forEach(t => {
              html += `<span class="tag-badge">${t}</span>`;
            });
            html += `</div>`;
          }
        }

        // 宿命值
        const fateLevel = GameState.getFateLevel();
        html += `<div class="fate-summary" style="color: ${fateLevel.color}">`;
        const chMaxF = getChapterMaxFate();
        html += `宿命值：${GameState.fateCounter} / ${chMaxF} · ${fateLevel.level}`;
        html += `</div>`;
        html += `<div style="font-size:0.75rem;color:var(--gold-dim);text-align:center;margin-top:4px;">${fateLevel.desc}</div>`;

        // 记忆碎片
        if (GameState.choiceLog.length > 0) {
          const lastChoice = GameState.choiceLog[GameState.choiceLog.length - 1];
          if (lastChoice && lastChoice.memory && memoryRegistry[lastChoice.memory]) {
            const mem = memoryRegistry[lastChoice.memory];
            html += `<div class="memory-card">`;
            html += `<div class="memory-card-title">💎 ${mem.title}</div>`;
            html += `<div class="memory-card-desc">${mem.description}</div>`;
            html += `</div>`;
          }
        }

        // 下一步按钮
        if (st.nextScene) {
          html += `<button class="next-btn" onclick="handleNext('${st.nextScene}')">${st.nextLabel || '继续'}</button>`;
        } else if (st.isChapterEnd) {
          // 检查是否有targetChapter（序章时代选择）
          let nextChapterNum = GameState.chapter + 1;
          const lastChoice = GameState.choiceLog.length > 0 ? GameState.choiceLog[GameState.choiceLog.length - 1] : null;
          if (lastChoice && lastChoice.targetChapter) {
            nextChapterNum = lastChoice.targetChapter;
          }
          const nextChapterId = nextChapterNum === 0 ? 'prologue' : 'chapter' + nextChapterNum;
          const nextChapterData = chapters[nextChapterId];

          if (st.isFinalEnd) {
            // 终章结束——提供重新开始选项
            html += `<button class="next-btn" onclick="GameEngine.resetGame();StorageManager.clearAll();GameState.chapter=0;GameState.currentScene='void_awakening';GameState.history=['void_awakening'];populateChapterSelect();Renderer.render();">${st.nextLabel || '重新开始'}</button>`;
            html += `<div style="text-align:center;margin-top:16px;font-style:italic;color:var(--gold-dim);font-size:0.85rem;">`;
            html += `<p>羊皮卷已经合上。感谢你来过马孔多。</p>`;
            html += `<p>任何时候——你都可以重新翻开第一页。</p>`;
            html += `</div>`;
          } else if (nextChapterData) {
            const enterLabel = '进入' + nextChapterData.title;
            html += `<button class="next-btn" onclick="GameEngine.goToNextChapter();Renderer.render();populateChapterSelect();">${enterLabel}</button>`;
            html += `<div style="text-align:center;margin-top:16px;font-style:italic;color:var(--gold-dim);font-size:0.85rem;">`;
            // 引入语句：使用章节副标题作为叙事钩子
            const nextMeta = CHAPTER_META[nextChapterId];
            if (nextMeta && nextMeta.subtitle) {
              const possessed = nextChapterData.possessedCharacter || '未知';
              html += `<p>你将附身于 <strong style="color:var(--gold-light);">${possessed}</strong></p>`;
              html += `<p style="margin-top:4px;">— ${nextMeta.subtitle}</p>`;
            }
            html += `</div>`;
          } else {
            html += `<button class="next-btn" style="opacity:0.6;cursor:default;">终章 · 故事结束</button>`;
            html += `<div style="text-align:center;margin-top:16px;font-style:italic;color:var(--gold-dim);font-size:0.85rem;">`;
            html += `<p>羊皮卷已经合上。故事到此结束。</p>`;
            html += `</div>`;
          }
        }

        html += `</div>`;
      } else if (scene.type === 'narrative') {
        // 纯叙事（分支结果）——显示"继续"按钮
        html += `<div class="right-section-title">继续旅程</div>`;
        html += `<div style="text-align:center;padding:20px;">`;
        html += `<p style="color:var(--gold-dim);font-style:italic;margin-bottom:16px;">阅读完左页的叙事内容后，点击继续。</p>`;
        html += `<button class="next-btn" onclick="handleContinue()">继续 ▸</button>`;
        html += `</div>`;
      }

      rightPage.innerHTML = html;
      rightPage.scrollTop = 0;
      rightPage.classList.remove('fading');
    }, 300);
  },

  /* 更新顶部栏 */
  updateTopBar(scene) {
    const progressLabel = document.getElementById('progress-label');
    const fateValue = document.getElementById('fate-value');
    const chapterData = getCurrentChapterData();
    const chapterTitle = chapterData ? chapterData.title : '未知章节';

    if (progressLabel) {
      if (GameState.chapter === 0) {
        progressLabel.textContent = '序章' + (scene.round > 0 ? ' · 时代选择' : '');
      } else if (scene.round === 0) {
        progressLabel.textContent = chapterTitle;
      } else if (scene.type === 'settlement' && scene.settlement && scene.settlement.isChapterEnd) {
        progressLabel.textContent = chapterTitle + ' · 章末结算';
      } else {
        progressLabel.textContent = chapterTitle + ' · 第' + scene.round + '轮';
      }
    }

    if (fateValue) {
      const oldValue = parseInt(fateValue.textContent) || 0;
      const newValue = GameState.fateCounter;
      fateValue.textContent = newValue;

      // 颜色
      const fateLevel = GameState.getFateLevel();
      fateValue.style.color = fateLevel.color;

      // 跳动动画（仅当值改变时）
      if (oldValue !== newValue) {
        fateValue.classList.remove('pulse');
        void fateValue.offsetWidth; // 触发回流
        fateValue.classList.add('pulse');
      }
    }
  },

  /* 更新书签/进度指示 */
  updateBookmark() {
    // 预留：可在顶部栏显示进度条
  },

  /* 获取说话者CSS类 */
  _getSpeakerClass(speaker) {
    if (speaker.includes('乌尔苏拉')) return 'ursula';
    if (speaker.includes('何塞')) return 'jose';
    if (speaker.includes('梅尔基亚德斯')) return 'melquiades';
    return 'narrator';
  }
};

/* ================================================================
   七、全局事件处理函数
   ================================================================ */
function handleChoice(choiceId) {
  const result = GameEngine.selectChoice(choiceId);
  if (result) {
    // 先渲染分支叙事（左页）+ 继续按钮（右页）
    Renderer.render();
    // 检查是否解锁记忆碎片
    if (result.effects.memory) {
      setTimeout(() => {
        showToast(`💎 解锁记忆碎片：「${result.effects.memory}」`);
      }, 600);
    }
  }
}

function handleContinue() {
  const scene = GameEngine.getCurrentScene();
  if (scene && scene.type === 'narrative' && scene.nextScene) {
    GameEngine.goToScene(scene.nextScene);
    Renderer.render();
  }
}

function handleNext(nextSceneId) {
  // 检测是否为章末结算，标记章节完成
  const currentScene = GameEngine.getCurrentScene();
  if (currentScene && currentScene.settlement && currentScene.settlement.isChapterEnd) {
    GameState.markChapterCompleted(GameState.chapter);
  }
  GameEngine.goToScene(nextSceneId);
  Renderer.render();
}

  queryRelation() {
    const raw1 = document.getElementById('relation-char1').value;
    const raw2 = document.getElementById('relation-char2').value;
    const resultDiv = document.getElementById('relation-result');
    if (!raw1 || !raw2 || !resultDiv) return;

    if (raw1 === raw2) {
      resultDiv.innerHTML = '<div style="color:var(--gold-dim);text-align:center;padding:12px;font-style:italic;">请选择两个不同的人物</div>';
      return;
    }

    const name1 = resolveCharacterName(raw1);
    const name2 = resolveCharacterName(raw2);

    // 直接关系
    const direct = findRelation(name1, name2);

    // 查找路径
    const path = findRelationPath(name1, name2);

    let html = '<div style="padding:12px;background:rgba(184,137,62,0.08);border:1px solid rgba(184,137,62,0.2);border-radius:8px;">';

      html += '<div style="margin-bottom:12px;">';
      html += '<div style="font-size:0.9rem;color:var(--gold-light);margin-bottom:4px;"><strong>' + name1 + '</strong> 与 <strong>' + name2 + '</strong></div>';

      html += '</div>';
    } else if (path && path.length > 0) {
      // 无直接关系，通过中间人关联
      html += '<div style="margin-bottom:12px;">';
      html += '<div style="font-size:0.9rem;color:var(--gold-light);margin-bottom:6px;"><strong>' + name1 + '</strong> 与 <strong>' + name2 + '</strong></div>';
      html += '<div style="font-size:0.78rem;color:var(--gold-dim);margin-bottom:8px;">无直接记录的关系，通过以下链路关联：</div>';
      // 用模糊代称描述路径
      const pathDescParts = [];
      for (let i = 0; i < path.length; i++) {
        const edge = path[i];
        const fromGender = CHARACTER_GENDERS[edge.from] || '未知';
        const toGender = CHARACTER_GENDERS[edge.to] || '未知';
        const fromRef = (i === 0) ? name1 : ('其' + (fromGender === '男' ? '丈夫' : fromGender === '女' ? '妻子' : '伴侣'));
        const toRef = (i === path.length - 1) ? name2 : ('其' + (toGender === '男' ? '丈夫' : toGender === '女' ? '妻子' : '伴侣'));
        pathDescParts.push(fromRef + '与' + toRef + '为' + edge.label);
      }
      html += '<div style="font-size:0.78rem;color:#c0b090;line-height:1.8;">' + pathDescParts.join('；') + '</div>';
      html += '</div>';
    } else {
      html += '<div style="color:var(--gold-dim);text-align:center;padding:12px;font-style:italic;">未找到两人之间的关联路径。<br>他们可能来自完全不同的时代与谱系。</div>';
    }

    html += '</div>';
    resultDiv.innerHTML = html;
  }
};

/* ================================================================
   十、存档/读档槽位面板

const SaveLoadPanel = {
  mode: 'save', // 'save' | 'load'
  CHINESE_NUMS: ['', '壹', '贰', '叁', '肆', '伍', '陆'],

  /** 打开面板 */
  open(mode) {
    this.mode = mode || 'save';
    const overlay = document.getElementById('saveload-overlay');
    const title = document.getElementById('saveload-title');
    if (!overlay || !title) return;

    title.textContent = mode === 'save' ? '💾 选择存档位置' : '📂 选择读档位置';
    this.renderCurrentInfo();
    this.renderSlots();
    overlay.classList.add('open');
  },

  /** 关闭面板 */
  close() {
    document.getElementById('saveload-overlay').classList.remove('open');
  },

  /** 渲染当前进度信息 */
  renderCurrentInfo() {
    const container = document.getElementById('saveload-current');
    if (!container) return;
    const chData = getCurrentChapterData();
    const scene = GameEngine.getCurrentScene();
    const chTitle = chData ? chData.title : '未知章节';
    const sceneTitle = scene ? (scene.title || '') : '';
    container.innerHTML = '当前进度：<strong>' + chTitle + '</strong>'
      + (GameState.round > 0 ? ' · 第' + GameState.round + '轮' : '')
      + (sceneTitle ? ' — ' + sceneTitle : '')
      + '　⭐ ' + GameState.fateCounter;
  },

  /** 渲染6个存档槽位 */
  renderSlots() {
    const grid = document.getElementById('save-slots-grid');
    if (!grid) return;
    const self = this;
    let html = '';

    for (let i = 1; i <= 6; i++) {
      const info = StorageManager.getSlotInfo(i);
      const numCN = this.CHINESE_NUMS[i];

      if (info) {
        // 已占用槽位
        html += '<div class="save-slot">';
        html += '<div class="save-slot-number">存档 ' + numCN + '</div>';
        html += '<div class="save-slot-details">';
        html += '<div class="save-slot-chapter">' + info.chapterTitle + '</div>';
        html += '<div class="save-slot-round">第' + info.round + '轮 · ' + info.sceneTitle + '　⭐ ' + info.fateCounter + '</div>';
        html += '<div class="save-slot-time">' + info.timestamp + '</div>';
        html += '</div>';
        html += '<div class="save-slot-actions">';
        html += '<button class="slot-btn load-btn" data-action="load" data-slot="' + i + '">📂 读取</button>';
        html += '<button class="slot-btn save-btn" data-action="save" data-slot="' + i + '">💾 覆盖</button>';
        html += '<button class="slot-btn delete-btn" data-action="delete" data-slot="' + i + '">🗑️</button>';
        html += '</div>';
        html += '</div>';
      } else {
        // 空槽位
        html += '<div class="save-slot empty">';
        html += '<div class="save-slot-number">存档 ' + numCN + '</div>';
        html += '<div class="save-slot-details">';
        html += '<div class="save-slot-empty-text">— 空存档位 —</div>';
        html += '</div>';
        html += '<div class="save-slot-actions">';
        html += '<button class="slot-btn save-btn" data-action="save" data-slot="' + i + '">💾 保存到此</button>';
        html += '</div>';
        html += '</div>';
      }
    }

    grid.innerHTML = html;

    // 绑定事件
    grid.querySelectorAll('.slot-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const action = this.dataset.action;
        const slot = parseInt(this.dataset.slot);
        self.handleAction(action, slot);
      });
    });
  },

  /** 处理槽位操作 */
  handleAction(action, slotNum) {
    switch (action) {
      case 'save':
        if (StorageManager.saveToSlot(slotNum)) {
          showToast('💾 已保存到存档 ' + this.CHINESE_NUMS[slotNum]);
          this.renderSlots();
        } else {
          showToast('❌ 存档失败');
        }
        break;

      case 'load':
        if (!StorageManager.getSlotInfo(slotNum)) {
          showToast('📂 该存档位为空');
          return;
        }
        if (confirm('确定要从存档 ' + this.CHINESE_NUMS[slotNum] + ' 读取吗？当前未保存的进度将丢失。')) {
          if (StorageManager.loadFromSlot(slotNum)) {
            StorageManager.autoSave(); // 同步自动存档
            populateChapterSelect();
            Renderer.render();
            this.close();
            showToast('📂 已从存档 ' + this.CHINESE_NUMS[slotNum] + ' 读取');
          } else {
            showToast('❌ 读档失败');
          }
        }
        break;

      case 'delete':
        if (confirm('确定要删除存档 ' + this.CHINESE_NUMS[slotNum] + ' 吗？此操作不可撤销。')) {
          StorageManager.deleteSlot(slotNum);
          this.renderSlots();
          showToast('🗑️ 存档 ' + this.CHINESE_NUMS[slotNum] + ' 已删除');
        }
        break;
    }
  }
};
function init() {
  // 加载设置
  SettingsPanel.loadSettings();

  // 尝试读取自动存档
  const hasSave = StorageManager.hasAutoSave();
  if (hasSave) {
    const loaded = StorageManager.autoLoad();
    if (loaded) {
      console.log('已读取自动存档');
    }
  }

  // 动态生成章节选择器
  populateChapterSelect();

  // 渲染初始场景
  Renderer.render();

  // 全新开始：遇到初始章节人物
  if (!hasSave) {
    GameEngine.encounterChapterMembers();
  }

  // 设置按钮事件
  document.getElementById('btn-settings').addEventListener('click', () => SettingsPanel.open());
  document.getElementById('btn-close-settings').addEventListener('click', () => SettingsPanel.close());
  document.getElementById('settings-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) SettingsPanel.close();
  });

  // 存档/读档面板事件
  document.getElementById('btn-close-saveload').addEventListener('click', () => SaveLoadPanel.close());
  document.getElementById('saveload-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) SaveLoadPanel.close();
  });

  // 字体大小按钮
  document.querySelectorAll('.font-size-btn').forEach(btn => {
    btn.addEventListener('click', () => SettingsPanel.setFontSize(btn.dataset.size));
  });

  // 音量滑块
  document.getElementById('volume-slider').addEventListener('input', (e) => {
    SettingsPanel.setVolume(parseInt(e.target.value));
  });

  // 音效开关
  document.getElementById('toggle-sfx').addEventListener('click', () => {
    SettingsPanel.toggleSfx();
  });

  // 重置游戏
  document.getElementById('btn-reset-game').addEventListener('click', () => SettingsPanel.resetGame());

  // 底部栏按钮 — 存档/读档改为打开槽位面板
  document.getElementById('btn-save').addEventListener('click', () => {
    SaveLoadPanel.open('save');
  });

  document.getElementById('btn-load').addEventListener('click', () => {
    SaveLoadPanel.open('load');
  });

  document.getElementById('btn-family-tree').addEventListener('click', () => SidebarManager.openFamilyTree());
  document.getElementById('btn-archives').addEventListener('click', () => SidebarManager.openArchives());
  document.getElementById('btn-profile').addEventListener('click', () => SidebarManager.openProfile());
  document.getElementById('btn-relations').addEventListener('click', () => SidebarManager.openRelations());

  // 侧边栏关闭按钮
  document.getElementById('close-family').addEventListener('click', () => SidebarManager.closeFamilyTree());
  document.getElementById('close-archives').addEventListener('click', () => SidebarManager.closeArchives());
  document.getElementById('close-profile').addEventListener('click', () => SidebarManager.closeProfile());
  document.getElementById('close-relations').addEventListener('click', () => SidebarManager.closeRelations());

  // 关系查询按钮
  document.getElementById('btn-query-relation').addEventListener('click', () => SidebarManager.queryRelation());

  // 侧边栏遮罩点击关闭
  document.getElementById('sidebar-family-overlay').addEventListener('click', () => SidebarManager.closeFamilyTree());
  document.getElementById('sidebar-archives-overlay').addEventListener('click', () => SidebarManager.closeArchives());
  document.getElementById('sidebar-profile-overlay').addEventListener('click', () => SidebarManager.closeProfile());
  document.getElementById('sidebar-relations-overlay').addEventListener('click', () => SidebarManager.closeRelations());

  // 键盘导航
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      // 关闭所有侧边栏和设置
      SidebarManager.closeFamilyTree();
      SidebarManager.closeArchives();
      SidebarManager.closeProfile();
      SidebarManager.closeRelations();
      SettingsPanel.close();
      SaveLoadPanel.close();
    }
    // 1/2/3 快捷选择
    if (e.key === '1' || e.key === '2' || e.key === '3') {
      const scene = GameEngine.getCurrentScene();
      if (scene && scene.type === 'choice' && scene.choices) {
        const idx = parseInt(e.key) - 1;
        if (scene.choices[idx]) {
          handleChoice(scene.choices[idx].id);
        }
      }
    }
  });

  console.log('《百年孤独 · 宿命之环》已就绪');
  console.log('按 1/2/3 键选择选项，按 Esc 关闭面板');
}

// 启动
document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
