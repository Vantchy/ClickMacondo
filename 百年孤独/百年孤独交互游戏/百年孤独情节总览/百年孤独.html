<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百年孤独 · 互动探索</title>
<style>
  :root {
    --ochre: #c4954a;
    --ochre-dark: #8b6914;
    --warm-yellow: #e8d5a3;
    --parchment: #f4e4c1;
    --parchment-dark: #d4c4a0;
    --dark-green: #2d4a3e;
    --dark-green-light: #3a5c4f;
    --ink: #3c2415;
    --ink-light: #5c3a1e;
    --burgundy: #6b2d2d;
    --gold: #b8860b;
    --cream: #faf3e0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'Serif';
    src: local('Georgia'), local('SimSun'), local('NSimSun'), local('Noto Serif SC'), local('Source Han Serif SC');
  }

  body {
    font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'SimSun', serif;
    background: #0d0a06;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }

  /* ── 全屏背景图 ── */
  #bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 0.9s ease;
    opacity: 1;
  }
  #bg-layer.fading { opacity: 0; }

  /* 图片加载过渡 */
  #bg-layer-next {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* ── 暗色叠加层 ── */
  #dark-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      180deg,
      rgba(10,8,4,0.55) 0%,
      rgba(10,8,4,0.3) 25%,
      rgba(10,8,4,0.25) 50%,
      rgba(10,8,4,0.35) 75%,
      rgba(10,8,4,0.65) 100%
    );
    pointer-events: none;
  }

  /* ── 纹理覆盖 ── */
  .texture-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: 0.06;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    box-shadow: inset 0 0 200px 80px rgba(0,0,0,0.7);
  }

  /* ── 内容区 ── */
  #content-wrapper {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 40px 100px;
    pointer-events: none;
  }
  #content-inner {
    pointer-events: none;
    max-width: 720px;
    width: 100%;
    text-align: center;
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  #content-inner.fading { opacity: 0; transform: translateY(16px); }

  .scene-tag {
    display: inline-block;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    color: var(--ochre);
    text-transform: uppercase;
    margin-bottom: 20px;
    padding: 5px 18px;
    border: 1px solid rgba(196,149,74,0.35);
    border-radius: 2px;
    background: rgba(10,8,4,0.3);
    backdrop-filter: blur(4px);
  }

  .character-name {
    display: inline-block;
    font-size: 1.15rem;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-bottom: 24px;
    cursor: pointer;
    pointer-events: all;
    transition: color 0.3s, text-shadow 0.3s;
    position: relative;
    padding: 6px 2px;
    text-shadow: 0 0 8px rgba(184,134,11,0.3);
  }
  .character-name::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: var(--gold);
    transform: scaleX(0);
    transition: transform 0.3s;
  }
  .character-name:hover { color: #e0b060; text-shadow: 0 0 16px rgba(184,134,11,0.5); }
  .character-name:hover::after { transform: scaleX(1); }

  .story-text {
    font-size: 1.3rem;
    line-height: 2.15;
    color: #efe8d8;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7), 0 0 40px rgba(0,0,0,0.4);
    text-align: justify;
    text-indent: 2em;
    max-width: 680px;
    margin: 0 auto;
    opacity: 0;
    animation: textReveal 1s ease forwards;
    pointer-events: none;
  }
  @keyframes textReveal {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .atmosphere-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 28px;
    flex-wrap: wrap;
    pointer-events: none;
  }
  .atmo-tag {
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    color: var(--ochre-dark);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 14px;
    background: rgba(10,8,4,0.35);
    border-radius: 2px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(139,105,20,0.2);
  }
  .atmo-tag::before {
    content: '◆';
    font-size: 0.35rem;
    color: var(--ochre);
  }

  /* ── 底部栏 ── */
  #bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 14px 32px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(transparent, rgba(10,8,4,0.85) 35%, rgba(10,8,4,0.95) 100%);
  }

  .progress-info {
    font-size: 0.78rem;
    color: var(--ochre-dark);
    letter-spacing: 0.1em;
    min-width: 100px;
  }

  .progress-track {
    flex: 1;
    margin: 0 24px;
    height: 2px;
    background: rgba(196,149,74,0.18);
    border-radius: 1px;
    position: relative;
    overflow: visible;
  }
  .progress-fill {
    height: 100%;
    background: var(--ochre);
    border-radius: 1px;
    transition: width 0.6s ease;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    right: -3px;
    top: -3px;
    width: 8px;
    height: 8px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(184,134,11,0.5);
  }

  .btn-graph {
    font-family: inherit;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--ochre);
    background: rgba(10,8,4,0.4);
    border: 1px solid rgba(196,149,74,0.4);
    padding: 7px 20px;
    border-radius: 2px;
    cursor: pointer;
    pointer-events: all;
    transition: all 0.3s;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }
  .btn-graph:hover {
    background: rgba(196,149,74,0.15);
    border-color: var(--ochre);
    box-shadow: 0 0 12px rgba(196,149,74,0.2);
  }

  /* ── 人物档案弹窗 ── */
  #modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.72);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    backdrop-filter: blur(2px);
  }
  #modal-overlay.active { opacity: 1; pointer-events: all; }

  .modal-card {
    background: linear-gradient(160deg, #f7ebd0 0%, #ecd9a8 35%, #e0cfa0 100%);
    max-width: 440px;
    width: 90%;
    padding: 38px 34px 30px;
    border-radius: 4px;
    border: 1px solid rgba(139,105,20,0.35);
    box-shadow:
      0 24px 64px rgba(0,0,0,0.65),
      0 0 0 1px rgba(196,149,74,0.18),
      inset 0 0 50px rgba(139,105,20,0.06);
    position: relative;
    transform: translateY(22px);
    transition: transform 0.4s;
    font-family: 'Georgia', 'KaiTi', 'STKaiti', 'SimSun', serif;
    color: var(--ink);
    max-height: 85vh;
    overflow-y: auto;
  }
  #modal-overlay.active .modal-card { transform: translateY(0); }

  .modal-card::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(139,105,20,0.12);
    border-radius: 2px;
    pointer-events: none;
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 18px;
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--ink-light);
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.3s;
    font-family: inherit;
  }
  .modal-close:hover { opacity: 1; }

  .modal-alias {
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    color: var(--ochre-dark);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .modal-name {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--ink);
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .modal-role {
    font-size: 0.8rem;
    color: var(--burgundy);
    margin-bottom: 18px;
    font-style: italic;
  }
  .modal-appearance, .modal-fate {
    font-size: 0.92rem;
    line-height: 1.85;
    color: var(--ink-light);
    margin-bottom: 10px;
    text-indent: 2em;
  }
  .modal-appearance { margin-top: 6px; }
  .modal-fate { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(139,105,20,0.15); }
  .modal-label {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    color: var(--ochre-dark);
    margin-bottom: 4px;
    text-indent: 0;
  }
  .modal-divider {
    width: 44px;
    height: 1px;
    background: var(--ochre-dark);
    margin: 18px auto;
    opacity: 0.35;
  }

  /* ── 关系图谱面板 ── */
  #graph-panel {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(10,8,4,0.96);
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  #graph-panel.active { opacity: 1; pointer-events: all; }

  .graph-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 32px;
    border-bottom: 1px solid rgba(196,149,74,0.12);
  }
  .graph-title {
    font-size: 1rem;
    letter-spacing: 0.15em;
    color: var(--ochre);
  }
  .graph-close {
    font-family: inherit;
    font-size: 0.78rem;
    color: var(--ochre);
    background: transparent;
    border: 1px solid rgba(196,149,74,0.4);
    padding: 7px 20px;
    border-radius: 2px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: all 0.3s;
  }
  .graph-close:hover { background: rgba(196,149,74,0.12); }

  #graph-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #graph-svg {
    width: 100%;
    height: 100%;
  }

  /* ── 图谱内人物浮窗 ── */
  #graph-popup-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: rgba(0,0,0,0.55);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s;
  }
  #graph-popup-overlay.active { opacity: 1; pointer-events: all; }

  .graph-popup-card {
    background: linear-gradient(160deg, #f7ebd0 0%, #ecd9a8 35%, #e0cfa0 100%);
    max-width: 390px;
    width: 85%;
    padding: 32px 28px 26px;
    border-radius: 4px;
    border: 1px solid rgba(139,105,20,0.35);
    box-shadow: 0 20px 52px rgba(0,0,0,0.7), 0 0 0 1px rgba(196,149,74,0.18);
    position: relative;
    font-family: 'Georgia', 'KaiTi', 'STKaiti', 'SimSun', serif;
    color: var(--ink);
    transform: translateY(18px);
    transition: transform 0.35s;
    max-height: 80vh;
    overflow-y: auto;
  }
  #graph-popup-overlay.active .graph-popup-card { transform: translateY(0); }

  .graph-popup-card::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(139,105,20,0.12);
    border-radius: 2px;
    pointer-events: none;
  }

  .graph-popup-close {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    font-size: 1.2rem;
    color: var(--ink-light);
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.3s;
    font-family: inherit;
  }
  .graph-popup-close:hover { opacity: 1; }

  .graph-popup-alias {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--ochre-dark);
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .graph-popup-name {
    font-size: 1.25rem;
    font-weight: bold;
    color: var(--ink);
    letter-spacing: 0.08em;
    margin-bottom: 3px;
  }
  .graph-popup-role {
    font-size: 0.75rem;
    color: var(--burgundy);
    margin-bottom: 14px;
    font-style: italic;
  }
  .graph-popup-appearance, .graph-popup-fate {
    font-size: 0.88rem;
    line-height: 1.8;
    color: var(--ink-light);
    text-indent: 2em;
  }
  .graph-popup-fate { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(139,105,20,0.15); }
  .graph-popup-label {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: var(--ochre-dark);
    text-indent: 0;
    margin-bottom: 2px;
  }
  .graph-popup-divider {
    width: 38px;
    height: 1px;
    background: var(--ochre-dark);
    margin: 14px auto;
    opacity: 0.35;
  }

  .graph-legend {
    display: flex;
    justify-content: center;
    gap: 28px;
    padding: 14px 32px;
    border-top: 1px solid rgba(196,149,74,0.12);
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.7rem;
    color: var(--ochre-dark);
    letter-spacing: 0.1em;
  }
  .legend-line {
    width: 22px;
    height: 1.5px;
  }

  /* ── 蝴蝶动画 ── */
  .butterfly {
    position: fixed;
    z-index: 4;
    pointer-events: none;
    font-size: 1.3rem;
    opacity: 0;
    animation: butterflyFall var(--dur) ease-in forwards;
    animation-delay: var(--delay);
    filter: drop-shadow(0 0 8px rgba(218,165,32,0.55));
  }
  @keyframes butterflyFall {
    0%   { opacity: 0; transform: translate(0, -30px) rotate(0deg) scale(0.5); }
    10%  { opacity: 0.9; }
    30%  { transform: translate(var(--dx1), 30vh) rotate(var(--r1)) scale(1); }
    60%  { transform: translate(var(--dx2), 60vh) rotate(var(--r2)) scale(0.9); }
    85%  { opacity: 0.7; }
    100% { opacity: 0; transform: translate(var(--dx3), 105vh) rotate(var(--r3)) scale(0.4); }
  }

  /* ── 提示文字 ── */
  .hint {
    position: fixed;
    bottom: 86px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    color: rgba(196,149,74,0.45);
    pointer-events: none;
    transition: opacity 0.8s;
  }

  /* ── 响应式 ── */
  @media (max-width: 600px) {
    #content-wrapper { padding: 40px 20px 90px; }
    .story-text { font-size: 1.05rem; line-height: 1.95; }
    .character-name { font-size: 1rem; }
    #bottom-bar { flex-wrap: wrap; gap: 10px; justify-content: center; }
    .progress-track { order: -1; width: 100%; margin: 0 0 6px; }
    .graph-popup-card { max-width: 300px; padding: 24px 20px 20px; }
    .modal-card { padding: 28px 22px 22px; }
  }
</style>
</head>
<body>

<!-- 全屏背景图层 -->
<div id="bg-layer"></div>
<div id="bg-layer-next"></div>

<!-- 暗色叠加 -->
<div id="dark-overlay"></div>

<!-- 纹理 & 暗角 -->
<div class="texture-overlay"></div>
<div class="vignette"></div>

<!-- 蝴蝶容器 -->
<div id="butterfly-container"></div>

<!-- 主舞台 -->
<div id="content-wrapper">
  <div id="content-inner">
    <div class="scene-tag" id="sceneTag"></div>
    <div class="character-name" id="charName" title="点击查看人物档案"></div>
    <div class="story-text" id="storyText"></div>
    <div class="atmosphere-row" id="atmoRow"></div>
  </div>
</div>

<!-- 点击提示 -->
<div class="hint" id="hint">点击画面任意位置 · 切换情节</div>

<!-- 底部栏 -->
<div id="bottom-bar">
  <div class="progress-info" id="progressInfo">第 1 / 23 段</div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill" style="width:4.35%"></div>
  </div>
  <button class="btn-graph" id="btnGraph" title="查看人物关系图谱">📜 家族树</button>
</div>

<!-- 人物档案弹窗 -->
<div id="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-alias" id="modalAlias"></div>
    <div class="modal-name" id="modalName"></div>
    <div class="modal-role" id="modalRole"></div>
    <div class="modal-divider"></div>
    <div class="modal-label">外貌</div>
    <div class="modal-appearance" id="modalAppearance"></div>
    <div class="modal-fate" id="modalFate"></div>
  </div>
</div>

<!-- 关系图谱面板 -->
<div id="graph-panel">
  <div class="graph-header">
    <span class="graph-title">📜 布恩迪亚家族 · 关系图谱</span>
    <button class="graph-close" id="graphClose">关闭</button>
  </div>
  <div id="graph-container">
    <svg id="graph-svg"></svg>
    <!-- 图谱内人物浮窗 -->
    <div id="graph-popup-overlay">
      <div class="graph-popup-card">
        <button class="graph-popup-close" id="graphPopupClose">✕</button>
        <div class="graph-popup-alias" id="graphPopupAlias"></div>
        <div class="graph-popup-name" id="graphPopupName"></div>
        <div class="graph-popup-role" id="graphPopupRole"></div>
        <div class="graph-popup-divider"></div>
        <div class="graph-popup-label">外貌</div>
        <div class="graph-popup-appearance" id="graphPopupAppearance"></div>
        <div class="graph-popup-fate" id="graphPopupFate"></div>
      </div>
    </div>
  </div>
  <div class="graph-legend">
    <div class="legend-item"><span class="legend-line" style="background:#c4954a;"></span> 夫妻</div>
    <div class="legend-item"><span class="legend-line" style="background:#6b8c5c;"></span> 父子/母子</div>
    <div class="legend-item"><span class="legend-line" style="background:#b8860b;border-style:dashed;border-bottom:1.5px dashed #b8860b;background:none;"></span> 情人</div>
    <div class="legend-item"><span class="legend-line" style="background:#9b6b9e;"></span> 恋人</div>
    <div class="legend-item"><span class="legend-line" style="background:#5c7a8a;"></span> 兄弟/朋友</div>
  </div>
</div>

<script>
// ═══════════ 全部内嵌数据 ═══════════
const DATA = {
  episodes: [
    {"id":1,"text":"多年以后，面对行刑队，奥雷里亚诺·布恩迪亚上校将会回想起父亲带他去见识冰块的那个遥远的下午。那时的马孔多是一个二十户人家的村落，泥巴和芦苇盖成的屋子沿河岸排开，湍急的河水清澈见底，河床里卵石洁白光滑宛如史前巨蛋。世界新生伊始，许多事物还没有名字，提到的时候尚需用手指指点点。","character":"奥雷里亚诺·布恩迪亚上校","scene":"马孔多","atmosphere":"午后","sound":"鸟鸣","specialEffect":"冰块"},
    {"id":2,"text":"他拖着两块金属锭走家串户，引发的景象使所有人目瞪口呆：铁锅、铁盆、铁钳、小铁炉纷纷跌落，木板因钉子绝望挣扎、螺丝奋力挣脱而吱嘎作响，甚至连那些丢失多日的物件也在久寻不见的地方出现，一窝蜂似的追随在梅尔基亚德斯的魔铁后面。","character":"梅尔基亚德斯","scene":"马孔多","atmosphere":"正午","sound":"金属碰撞声","specialEffect":"磁铁"},
    {"id":3,"text":"最终，在十二月一个星期二的午饭时分，他从所有的折磨中一下解脱了。孩子们终其一生都将记得父亲如何在桌首庄严入座，被长期熬夜和苦思冥想折磨得形销骨立，因激动而颤抖着，向他们透露自己的发现：地球是圆的，就像个橙子。","character":"何塞·阿尔卡蒂奥·布恩迪亚","scene":"老宅","atmosphere":"正午","sound":"钟声","specialEffect":"地球仪"},
    {"id":4,"text":"吉卜赛人纠正道：不是钻石，是冰块。何塞·阿尔卡蒂奥·布恩迪亚付了钱，把手放在冰块上，就这样停了好几分钟，心中充满了体验神秘的恐惧和喜悦。他无法用语言表达，又另付了十个里亚尔，让儿子们也体验一下这神奇的感觉。","character":"何塞·阿尔卡蒂奥·布恩迪亚","scene":"吉普赛营地","atmosphere":"黄昏","sound":"铃铛声","specialEffect":"冰块"},
    {"id":5,"text":"何塞·阿尔卡蒂奥·布恩迪亚以公牛般的力气投出了长矛，以第一代奥雷里亚诺·布恩迪亚当年猎杀本地老虎的准头，刺穿了他的咽喉。那是六月里一个美好的夜晚，天气清凉，月光明亮。两人一夜不眠，在床上嬉闹直到破晓，任凭夜风吹过卧室。","character":"何塞·阿尔卡蒂奥·布恩迪亚","scene":"老宅","atmosphere":"黎明","sound":"风声","specialEffect":"血"},
    {"id":6,"text":"他梦见那个地方耸立起一座喧嚣的城市，家家户户以镜子为墙。他询问这是什么城市，得到的回答是一个他从未听说、也没有任何含义的名字，但那名字却在梦中神秘地回响：马孔多。第二天，他说服众人相信永远也找不到大海了，在河边最凉爽的地方建起了村庄。","character":"何塞·阿尔卡蒂奥·布恩迪亚","scene":"雨林","atmosphere":"黎明","sound":"河水声","specialEffect":"镜子之城"},
    {"id":7,"text":"那是什么感觉？奥雷里亚诺问道。何塞·阿尔卡蒂奥当即回答：好像地震。一月里一个星期四的凌晨两点，阿玛兰妲出生了。在其他人进入房间之前，乌尔苏拉先把她浑身上下细细检查了一遍，身体所有部位都属于人类无疑。","character":"何塞·阿尔卡蒂奥","scene":"老宅","atmosphere":"凌晨","sound":"雨声","specialEffect":"地震"},
    {"id":8,"text":"何塞·阿尔卡蒂奥感觉身体悬空，飞向极乐之境，心灵融化在柔情色欲的泉源里，那情欲涌入女郎的耳朵，又从她的口中变成语言涌出。那天是星期四。到星期六晚上，何塞·阿尔卡蒂奥往头上缠了块红布，跟着吉卜赛人走了。","character":"何塞·阿尔卡蒂奥","scene":"吉普赛营地","atmosphere":"夜晚","sound":"鼓声","specialEffect":"红布"},
    {"id":9,"text":"丽贝卡坐在厨房角落里的摇椅上，梦见一个和自己相貌极其相似的男人，他身着白色亚麻衣裳，衬衫领口别着一粒金扣，给她带来一束玫瑰。陪伴他的还有一位女士，用纤细的手指拣出一枝玫瑰簪在她发间。","character":"丽贝卡·布恩迪亚","scene":"老宅","atmosphere":"黄昏","sound":"钟声","specialEffect":"玫瑰"},
    {"id":10,"text":"奥雷里亚诺把名称写在纸上，用树胶贴在小铁砧底部：砧子。这样，他相信今后就不会再忘记。他用小刷子蘸上墨水给每样东西注明名称：桌子，椅子，钟，门，墙，床，平锅。他又到畜栏为动物和植物标上名称：奶牛，山羊，猪，母鸡，木薯，海芋，香蕉。","character":"奥雷里亚诺·布恩迪亚上校","scene":"老宅","atmosphere":"正午","sound":"雨声","specialEffect":"羊皮卷"},
    {"id":11,"text":"马孔多欢庆重获记忆的同时，何塞·阿尔卡蒂奥·布恩迪亚和梅尔基亚德斯正在重温往昔的友情。老吉卜赛人准备就此留在镇上。他的确一度死去，但难以忍受孤独又重返人世。他因执著于生命受到惩罚，被剥夺了一切超自然能力，又被逐出了部落。","character":"梅尔基亚德斯","scene":"老宅","atmosphere":"黄昏","sound":"雷声","specialEffect":"银版照片"},
    {"id":12,"text":"她曾经在泥土的味道中，在皮埃特罗·克雷斯皮芬芳的书信里，在丈夫如狂风暴雨的床榻上徒劳地寻寻觅觅，最终却在这个家中找到了安宁。在这里，记忆因思绪无情的力量化为实体，如同活人一般在幽闭的房间里游荡。","character":"丽贝卡·布恩迪亚","scene":"老宅","atmosphere":"黄昏","sound":"风声","specialEffect":"血"},
    {"id":13,"text":"奥雷里亚诺·布恩迪亚上校发动过三十二场武装起义，无一成功。他与十七个女人生下十七个儿子，一夜之间都被逐个除掉，其中最年长的不到三十五岁。他逃过十四次暗杀、七十三次伏击和一次枪决。他有一次被人在咖啡里投毒，投入的马钱子碱足够毒死一匹马。","character":"奥雷里亚诺·布恩迪亚上校","scene":"马孔多","atmosphere":"黎明","sound":"马蹄声","specialEffect":"金鱼"},
    {"id":14,"text":"何塞·阿尔卡蒂奥刚关上卧室的门，一声枪响震彻全屋。一道血线从门下涌出，穿过客厅，流到街上，沿着起伏不平的便道径直向前，经台阶下行，爬上路栏，绕过土耳其人大街，右拐又左拐，九十度转向直奔布恩迪亚家。","character":"何塞·阿尔卡蒂奥","scene":"街道","atmosphere":"黄昏","sound":"枪声","specialEffect":"血线"},
    {"id":15,"text":"何塞·阿尔卡蒂奥·布恩迪亚在一个有无穷房间的梦中得到慰藉。他梦见自己从床上起来，打开房门，走进另一间一模一样的房间，里面有同样铸铁床头的床、同样的藤椅和后墙上同样的救难圣母像。从这一间又进入另一间一模一样的，如此循环，无穷无尽。","character":"何塞·阿尔卡蒂奥·布恩迪亚","scene":"老宅","atmosphere":"黎明","sound":"钟声","specialEffect":"镜廊"},
    {"id":16,"text":"花雨在镇上落了一整夜，这静寂的风暴覆盖了房顶，堵住了屋门，令露宿的动物窒息而死。如此多的花朵自天而降，天亮时大街小巷都覆上了一层绵密的花毯，人们得用铲子耙子清理出通道才能出殡。","character":"何塞·阿尔卡蒂奥·布恩迪亚","scene":"马孔多","atmosphere":"黎明","sound":"风声","specialEffect":"黄花雨"},
    {"id":17,"text":"奥雷里亚诺·布恩迪亚上校坐在栗树下小便，忽然听见远处铜管奏乐、大鼓轰鸣、孩童欢呼。他看见一个女人穿得金光闪闪骑在大象的脖子上，看见哀伤的单峰驼，看见打扮成荷兰姑娘的熊用炒勺和菜锅敲出音乐节奏。","character":"奥雷里亚诺·布恩迪亚上校","scene":"马孔多","atmosphere":"黄昏","sound":"铜管乐","specialEffect":"马戏团"},
    {"id":18,"text":"美人儿蕾梅黛丝开始离开地面。乌尔苏拉那时几近失明，却只有她能镇定自若地看出那阵不可阻挡的微风因何而来，便任凭床单随光芒而去，看着她挥手告别，身边鼓荡放光的床单和她一起冉冉上升，永远消失在连飞得最高的回忆之鸟也无法企及的高邈空间。","character":"美人儿蕾梅黛丝","scene":"老宅","atmosphere":"黄昏","sound":"风声","specialEffect":"升天"},
    {"id":19,"text":"工人被包围在车站，十四处机枪掩体立时响应。一切宛似一场闹剧，仿佛机枪正在喷射的只是骗人的烟火，因为能听见急迫的枪声嗒嗒，能看见白炽的烈焰喷吐，却感受不到任何轻微的反应。突然，一声垂死的呼号打破了着魔般的状态：啊啊，妈妈呀。","character":"何塞·阿尔卡蒂奥第二","scene":"马孔多","atmosphere":"正午","sound":"枪声","specialEffect":"血"},
    {"id":20,"text":"那是他平生见过的最长的火车，有将近两百节运货车厢，首尾各有一个火车头，中间还夹着一个。火车悄无声息地在夜间滑行，车上没有任何光亮，连定位的红绿灯光也没有。车厢顶上依稀可见一挺挺机枪旁士兵的黑影。","character":"何塞·阿尔卡蒂奥第二","scene":"雨林","atmosphere":"黑夜","sound":"雨声","specialEffect":"尸体火车"},
    {"id":21,"text":"他们发现了他和他的孩子。那孩子只剩下一张肿胀干瘪的皮，全世界的蚂蚁一齐出动，正沿着花园的石子路努力把他拖回巢去。奥雷里亚诺僵在原地，因为在那神奇的一瞬梅尔基亚德斯终极的密码向他显明了意义。","character":"奥雷里亚诺·巴比伦","scene":"老宅","atmosphere":"黎明","sound":"蚁声","specialEffect":"蚂蚁"},
    {"id":22,"text":"奥雷里亚诺平生从未像此刻一般清醒，他忘却了家中的死者，忘却了死者的痛苦，用费尔南达留下的十字木条再次钉死门窗，远离世间一切干扰，因为他知道梅尔基亚德斯的羊皮卷上记载着自己的命运。他顾不得拿到光亮处，就站在原地，开始毫不费力地大声破译。","character":"奥雷里亚诺·巴比伦","scene":"老宅","atmosphere":"黎明","sound":"风声","specialEffect":"羊皮卷"},
    {"id":23,"text":"马孔多在《圣经》所载那种龙卷风的怒号中化作可怕的瓦砾与尘埃旋涡时，奥雷里亚诺译出羊皮卷的最后一页。这座镜子之城——或蜃景之城——将在奥雷里亚诺·巴比伦全部译出羊皮卷之时被飓风抹去，从世人记忆中根除，注定经受百年孤独的家族不会有第二次机会在大地上出现。","character":"奥雷里亚诺·巴比伦","scene":"马孔多","atmosphere":"黄昏","sound":"飓风","specialEffect":"龙卷风"}
  ],
  characters: [
    {"name":"何塞·阿尔卡蒂奥·布恩迪亚","alias":"老布恩迪亚","description":"马孔多的创始人，富有进取心和想象力，痴迷于吉卜赛人带来的磁铁、放大镜等科学发明和炼金术。他天马行空，带领村民翻山越岭寻找大海，最终因疯狂被绑在栗树下，晚年与亡灵为伴，在无尽的梦境中游荡。","appearance":"身材魁梧，胡须野蛮，目光充满探索精神，晚年形销骨立。","fate":"在栗树下衰老而死，尸体被无数小黄花覆盖。","familyRole":"家族族长 / 父亲"},
    {"name":"乌尔苏拉·伊瓜兰","alias":"乌尔苏拉","description":"何塞·阿尔卡蒂奥·布恩迪亚的妻子，身材娇小却活力充沛，意志坚定，是家族真正的支柱。她勤劳能干，经营糖果小动物生意，见证了家族六代人的兴衰。晚年双目失明，却凭其他感官洞察一切，是家族历史的守护者。","appearance":"身材娇小，穿着细棉布裙，眼神坚定，充满活力。","fate":"在百岁高龄去世，死前预言自己将在雨停后死去。","familyRole":"家族女族长 / 母亲"},
    {"name":"奥雷里亚诺·布恩迪亚上校","alias":"上校","description":"何塞与乌尔苏拉的次子，沉默寡言，富有预感和洞察力。他发动了三十二场起义，均告失败，成为传奇人物。他一生深陷战争与孤独，晚年在小作坊里反复制作小金鱼，在无尽的循环中寻求平静。","appearance":"瘦削，颧骨突出，眼神锐利，留着翘尖角的黑髭须。","fate":"在栗树下因衰老和孤独悄然去世，尸体被秃鹫发现。","familyRole":"次子 / 革命军上校"},
    {"name":"何塞·阿尔卡蒂奥","alias":"大何塞","description":"何塞与乌尔苏拉的长子，体格魁梧，冲动任性。少年时随吉卜赛人出走，多年后返回，浑身刺青，与丽贝卡结婚。他因强占土地引来麻烦，最终在卧室中被不明来源的枪击打死，死因成谜。","appearance":"身材过人的大汉，满身刺青，头发像骡子的鬃毛。","fate":"在家中卧室被枪杀，死因成谜。","familyRole":"长子"},
    {"name":"阿玛兰妲·布恩迪亚","alias":"阿玛兰妲","description":"何塞与乌尔苏拉的女儿，性格高傲，内心充满矛盾的爱与恨。她因嫉妒百般阻挠丽贝卡的婚事，又因无法战胜恐惧拒绝了皮埃特罗·克雷斯皮和赫里内勒多·马尔克斯的爱，在悔恨和孤独中为自己编织精美的寿衣。","appearance":"面容苍白，眼神高傲，手上永远缠着代表赎罪的黑纱。","fate":"预知死期后，平静地织完寿衣，宣告死讯后去世。","familyRole":"女儿"},
    {"name":"丽贝卡·布恩迪亚","alias":"丽贝卡","description":"乌尔苏拉的远房表妹，被收养。她幼年有食土癖，性格冲动热烈。她爱上皮埃特罗·克雷斯皮，后又嫁给何塞·阿尔卡蒂奥，丈夫死后将自己幽闭家中，与世隔绝至死，带着她暴躁的激情和秘密孤独地老去。","appearance":"面容白皙，眼睛大而沉静，青绿色皮肤，喜欢坐在摇椅上。","fate":"在孤寂的破败老屋中老死，无人知晓。","familyRole":"养女 / 表妹"},
    {"name":"梅尔基亚德斯","alias":"老吉卜赛人","description":"吉卜赛智者，带来了磁铁、放大镜、冰块等新发明，并留下了用梵文写成的羊皮卷，预言了布恩迪亚家族的历史。他死后因难以忍受孤独又重返人间，最终在马孔多安详去世，是家族智慧的源头。","appearance":"衰老，大胡子，手如雀爪，头戴黑色大礼帽，身穿天鹅绒坎肩。","fate":"在新加坡死于热病，但又重返人间，最后在马孔多去世。","familyRole":"家族挚友 / 导师"},
    {"name":"美人儿蕾梅黛丝","alias":"蕾梅黛丝","description":"阿尔卡蒂奥和桑塔索菲亚·德拉·彼达的女儿，拥有惊世骇俗的美貌和致命的气息，却天真无邪，不谙世事。她对男人毫无兴趣，拥有非凡的洞察力，最终在花园里晾晒床单时，肉身和灵魂一起升天而去。","appearance":"惊人的美貌，光头，喜欢穿简单的麻布长袍，赤身裸体。","fate":"在花园里被风吹起，肉身和灵魂一起升天消失。","familyRole":"曾孙女 / 第三代"},
    {"name":"奥雷里亚诺第二","alias":"大胖子","description":"阿尔卡蒂奥与桑塔索菲亚的双胞胎儿子之一，性格开朗，喜爱聚会和挥霍。通过情妇佩特拉·科特斯获得了令牲畜疯狂繁殖的运气，积攒了巨大财富，但最终因咽喉肿瘤在贫困和失声中死去。","appearance":"体形魁梧，有快活的乌龟脸，因暴饮暴食而肥胖。","fate":"患咽喉肿瘤，在贫困和失声中死去。","familyRole":"曾孙 / 双胞胎之一 / 第四代"},

// ── 图片路径映射 ──
const IMG_BASE = '百年孤独插画/';
const IMG_PREFIX = '《百年孤独》版画场景';
const IMG_EXT = '.png';
function getImagePath(episodeId) {
  return IMG_BASE + IMG_PREFIX + episodeId + IMG_EXT;
}

// ═══════════ 核心逻辑 ═══════════
let currentEpisode = 0;
const totalEpisodes = DATA.episodes.length;

// DOM 引用
const $ = (sel) => document.querySelector(sel);
const bgLayer = $('#bg-layer');
const bgLayerNext = $('#bg-layer-next');
const contentInner = $('#content-inner');
const sceneTag = $('#sceneTag');
const charName = $('#charName');
const storyText = $('#storyText');
const atmoRow = $('#atmoRow');
const progressInfo = $('#progressInfo');
const progressFill = $('#progressFill');
const hintEl = $('#hint');
const modalOverlay = $('#modal-overlay');
const butterflyContainer = $('#butterfly-container');
const graphPanel = $('#graph-panel');
const graphSvg = $('#graph-svg');
const graphPopupOverlay = $('#graph-popup-overlay');

// ── 预加载图片 ──
const preloadedImages = {};
function preloadImage(id) {
  if (preloadedImages[id]) return preloadedImages[id];
  const img = new Image();
  img.src = getImagePath(id);
  preloadedImages[id] = img;
  return img;
}
// 预加载前几张
for (let i = 1; i <= Math.min(5, totalEpisodes); i++) {
  preloadImage(i);
}

// ── 设置背景图 ──
let currentBgId = null;
function setBackground(episodeId, instant) {
  if (currentBgId === episodeId) return;
  currentBgId = episodeId;

  const imgPath = getImagePath(episodeId);
  const encodedPath = encodeURI(imgPath);
  // 预加载
  preloadImage(episodeId);

  if (instant) {
    bgLayer.style.backgroundImage = `url('${encodedPath}')`;
    bgLayer.style.opacity = '1';
    bgLayer.classList.remove('fading');
    return;
  }

  // 淡出当前 → 换图 → 淡入
  bgLayer.classList.add('fading');
  setTimeout(() => {
    bgLayer.style.backgroundImage = `url('${encodedPath}')`;
    bgLayer.classList.remove('fading');
  }, 600);
}

// ── 渲染情节 ──
function renderEpisode(idx, instant) {
  const ep = DATA.episodes[idx];
  if (!ep) return;

  // 更新背景图
  setBackground(ep.id, instant);

  // 淡出文字
  contentInner.classList.add('fading');

  setTimeout(() => {
    // 更新场景标签
    sceneTag.textContent = `${ep.scene} · ${ep.atmosphere}`;

    // 更新人物名
    charName.textContent = ep.character;
    charName.onclick = (e) => { e.stopPropagation(); openCharacterModal(ep.character); };

    // 更新故事文本（重置动画）
    storyText.style.animation = 'none';
    storyText.offsetHeight;
    storyText.textContent = ep.text;
    storyText.style.animation = 'textReveal 1s ease forwards';

    // 氛围标签
    atmoRow.innerHTML = `
      <span class="atmo-tag">🔊 ${ep.sound}</span>
      <span class="atmo-tag">✨ ${ep.specialEffect}</span>
    `;

    // 进度
    const pct = ((idx + 1) / totalEpisodes) * 100;
    progressInfo.textContent = `第 ${idx + 1} / ${totalEpisodes} 段`;
    progressFill.style.width = pct + '%';

    // 淡入文字
    contentInner.classList.remove('fading');

    // 预加载下一张图
    const nextId = DATA.episodes[(idx + 1) % totalEpisodes].id;
    preloadImage(nextId);
  }, 600);
}

// ── 点击画面推进 ──
document.addEventListener('click', (e) => {
  // 检查是否点击在交互元素上
  if (e.target === charName || charName.contains(e.target)) return;
  if (e.target.closest('.modal-card')) return;
  if (e.target.closest('#graph-panel.active')) return;
  if (e.target.closest('#modal-overlay.active')) return;
  if (e.target.closest('button, .btn-graph')) return;

  currentEpisode = (currentEpisode + 1) % totalEpisodes;
  renderEpisode(currentEpisode);
  spawnButterflies(2);
  hintEl.style.opacity = '0';
});

// ── 键盘操作 ──
document.addEventListener('keydown', (e) => {
  if (modalOverlay.classList.contains('active')) {
    if (e.key === 'Escape') closeModal();
    return;
  }
  if (graphPanel.classList.contains('active')) {
    if (e.key === 'Escape') {
      if (graphPopupOverlay.classList.contains('active')) {
        closeGraphPopup();
      } else {
        closeGraph();
      }
    }
    return;
  }
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    currentEpisode = (currentEpisode + 1) % totalEpisodes;
    renderEpisode(currentEpisode);
    spawnButterflies(2);
    hintEl.style.opacity = '0';
  }
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    currentEpisode = (currentEpisode - 1 + totalEpisodes) % totalEpisodes;
    renderEpisode(currentEpisode);
    spawnButterflies(2);
    hintEl.style.opacity = '0';
  }
});

// ── 触摸滑动支持 ──
let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (modalOverlay.classList.contains('active') || graphPanel.classList.contains('active')) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  // 仅当水平滑动超过阈值且不是垂直滚动时
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) {
      currentEpisode = (currentEpisode + 1) % totalEpisodes;
    } else {
      currentEpisode = (currentEpisode - 1 + totalEpisodes) % totalEpisodes;
    }
    renderEpisode(currentEpisode);
    spawnButterflies(2);
    hintEl.style.opacity = '0';
  }
});

// ═══════════ 人物档案弹窗 ═══════════
function openCharacterModal(name) {
  const ch = DATA.characters.find(c => c.name === name);
  if (!ch) return;

  $('#modalAlias').textContent = ch.alias;
  $('#modalName').textContent = ch.name;
  $('#modalRole').textContent = ch.familyRole;
  $('#modalAppearance').textContent = ch.appearance || '暂无记载';
  $('#modalFate').textContent = ch.fate || '命运成谜';
  modalOverlay.classList.add('active');
}

function closeModal() {
  modalOverlay.classList.remove('active');
}

$('#modalClose').addEventListener('click', (e) => { e.stopPropagation(); closeModal(); });
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});

// ═══════════ 图谱内人物浮窗 ═══════════
function openGraphPopup(name) {
  const ch = DATA.characters.find(c => c.name === name);
  if (!ch) return;

  $('#graphPopupAlias').textContent = ch.alias;
  $('#graphPopupName').textContent = ch.name;
  $('#graphPopupRole').textContent = ch.familyRole;
  $('#graphPopupAppearance').textContent = ch.appearance || '暂无记载';
  $('#graphPopupFate').textContent = ch.fate || '命运成谜';
  graphPopupOverlay.classList.add('active');
}

function closeGraphPopup() {
  graphPopupOverlay.classList.remove('active');
}

$('#graphPopupClose').addEventListener('click', (e) => { e.stopPropagation(); closeGraphPopup(); });
graphPopupOverlay.addEventListener('click', (e) => {
  if (e.target === graphPopupOverlay) closeGraphPopup();
});

// ═══════════ 黄蝴蝶飘落 ═══════════
function spawnButterflies(count) {
  const butterflies = ['🦋', '🦋', '🦋'];
  for (let i = 0; i < count; i++) {
    const b = document.createElement('span');
    b.className = 'butterfly';
    b.textContent = butterflies[Math.floor(Math.random() * butterflies.length)];
    b.style.left = Math.random() * 90 + '%';
    b.style.setProperty('--dur', (6 + Math.random() * 8) + 's');
    b.style.setProperty('--delay', Math.random() * 1.5 + 's');
    b.style.setProperty('--dx1', (Math.random() - 0.5) * 120 + 'px');
    b.style.setProperty('--dx2', (Math.random() - 0.5) * 160 + 'px');
    b.style.setProperty('--dx3', (Math.random() - 0.5) * 200 + 'px');
    b.style.setProperty('--r1', Math.random() * 60 - 30 + 'deg');
    b.style.setProperty('--r2', Math.random() * 90 - 45 + 'deg');
    b.style.setProperty('--r3', Math.random() * 120 - 60 + 'deg');
    butterflyContainer.appendChild(b);

    b.addEventListener('animationend', () => b.remove());
  }
}

// 初始蝴蝶
setTimeout(() => spawnButterflies(3), 800);
// 周期性
setInterval(() => {
  if (!graphPanel.classList.contains('active') && !modalOverlay.classList.contains('active')) {
    spawnButterflies(1);
  }
}, 8000);

// ═══════════ 关系图谱 ═══════════
$('#btnGraph').addEventListener('click', openGraph);
$('#graphClose').addEventListener('click', closeGraph);

function openGraph() {
  graphPanel.classList.add('active');
  renderGraph();
}

function closeGraph() {
  // 先关闭内部浮窗
  if (graphPopupOverlay.classList.contains('active')) {
    closeGraphPopup();
  }
  graphPanel.classList.remove('active');
}

function renderGraph() {
  const svg = graphSvg;
  const container = $('#graph-container');
  const W = container.clientWidth || 900;
  const H = container.clientHeight || 700;

  // 节点布局 —— 按世代分层
  const layers = {
    'gen0': ['梅尔基亚德斯'],
    'gen1': ['何塞·阿尔卡蒂奥·布恩迪亚', '乌尔苏拉·伊瓜兰'],
    'gen1b': ['庇拉尔·特尔内拉'],
    'gen2': ['何塞·阿尔卡蒂奥', '奥雷里亚诺·布恩迪亚上校', '阿玛兰妲·布恩迪亚', '丽贝卡·布恩迪亚'],
    'gen2b': ['蕾梅黛丝·摩斯科特', '皮埃特罗·克雷斯皮', '赫里内勒多·马尔克斯上校'],
    'gen3': ['阿尔卡蒂奥', '桑塔索菲亚·德拉·彼达', '美人儿蕾梅黛丝'],
    'gen4': ['奥雷里亚诺第二', '何塞·阿尔卡蒂奥第二', '佩特拉·科特斯', '费尔南达·德尔·卡皮奥'],
    'gen5': ['梅梅', '阿玛兰妲·乌尔苏拉', '马乌里肖·巴比伦', '加斯通'],
    'gen6': ['奥雷里亚诺·巴比伦']
  };

  const layerKeys = ['gen0','gen1','gen1b','gen2','gen2b','gen3','gen4','gen5','gen6'];
  const layerLabels = ['智者','第一代','情人','第二代','配角','第三代','第四代','第五代','第六代'];

  // 分配位置
  const positions = {};
  const nodeW = 105, nodeH = 38;
  const startY = 50, gapY = 72;
  const marginX = 30;

  layerKeys.forEach((lk, li) => {
    const names = layers[lk];
    if (!names || names.length === 0) return;
    const y = startY + li * gapY;
    const totalW = names.length * (nodeW + 14) - 14;
    const startX = Math.max(marginX, (W - totalW) / 2);
    names.forEach((name, ni) => {
      positions[name] = {
        x: startX + ni * (nodeW + 14) + nodeW / 2,
        y: y + nodeH / 2
      };
    });
  });

  // 连线颜色 & 样式
  const typeColors = {
    '夫妻': '#c4954a',
    '父子': '#6b8c5c',
    '父女': '#6b8c5c',
    '母子': '#6b8c5c',
    '母女': '#6b8c5c',
    '情人': '#b8860b',
    '情侣': '#9b6b9e',
    '恋人': '#9b6b9e',
    '恋人（未成）': '#9b6b9e',
    '恋人（近亲）': '#9b6b9e',
    '孪生兄弟': '#5c7a8a',
    '兄弟': '#5c7a8a',
    '朋友': '#5c7a8a',
    '朋友/战友': '#5c7a8a',
    '姐妹/情敌': '#cc6655',
    '师生': '#6b8c8c'
  };
  const typeDash = {
    '情人': '5,3',
    '情侣': '4,3',
    '恋人': '4,3',
    '恋人（未成）': '4,3',
    '恋人（近亲）': '4,2'
  };

  let svgContent = `<defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100%" height="100%" fill="#0d0a06"/>`;

  // 世代标签
  layerKeys.forEach((lk, li) => {
    const names = layers[lk];
    if (!names || names.length === 0) return;
    const y = startY - 16 + li * gapY;
    svgContent += `<text x="16" y="${y}" fill="#5c4a2a" font-size="10" font-family="Georgia,serif" letter-spacing="2" opacity="0.55">${layerLabels[li]}</text>`;
    svgContent += `<line x1="16" y1="${y + 5}" x2="${W - 16}" y2="${y + 5}" stroke="rgba(196,149,74,0.06)" stroke-width="0.5"/>`;
  });

  // 连线
  DATA.relationships.forEach(rel => {
    const from = positions[rel.from];
    const to = positions[rel.to];
    if (!from || !to) return;

    const color = typeColors[rel.type] || '#888';
    const dash = typeDash[rel.type] || 'none';

    const midY = (from.y + to.y) / 2;
    const cpY = midY;

    svgContent += `<path d="M${from.x},${from.y} C${from.x},${cpY} ${to.x},${cpY} ${to.x},${to.y}"
      fill="none" stroke="${color}" stroke-width="1.1" stroke-dasharray="${dash}" opacity="0.65"/>`;

    // 关系标签
    const mx = (from.x + to.x) / 2;
    const my = (from.y + to.y) / 2 - 7;
    svgContent += `<text x="${mx}" y="${my}" fill="${color}" font-size="9" text-anchor="middle"
      font-family="Georgia,serif" opacity="0.75">${rel.type}</text>`;
  });

  // 节点
  Object.entries(positions).forEach(([name, pos]) => {
    const ch = DATA.characters.find(c => c.name === name);
    const displayName = ch ? (ch.alias || name) : name;
    const isCore = ch && ['何塞·阿尔卡蒂奥·布恩迪亚','乌尔苏拉·伊瓜兰','奥雷里亚诺·布恩迪亚上校'].includes(name);

    const fillColor = isCore ? '#8b6914' : '#2d4a3e';
    const strokeColor = isCore ? '#c4954a' : '#4a6a4a';

    svgContent += `<g class="graph-node" style="cursor:pointer" data-name="${escapeHtml(name)}"
      onmouseover="this.querySelector('rect').setAttribute('fill','${isCore ? '#c4954a' : '#4a7a4a'}')"
      onmouseout="this.querySelector('rect').setAttribute('fill','${fillColor}')"
      onclick="event.stopPropagation(); openGraphPopup('${escapeHtml(name)}')">
      <rect x="${pos.x - nodeW/2}" y="${pos.y - nodeH/2}" width="${nodeW}" height="${nodeH}" rx="3"
        fill="${fillColor}" stroke="${strokeColor}"
        stroke-width="1" opacity="0.9" filter="url(#glow)"/>
      <text x="${pos.x}" y="${pos.y + 3}" fill="#e8d5a3" font-size="10.5" text-anchor="middle"
        font-family="Georgia,'Noto Serif SC',serif" letter-spacing="0.5">${displayName}</text>
    </g>`;
  });

  svgContent += `<text x="${W/2}" y="${H - 12}" fill="#5c4a2a" font-size="10" text-anchor="middle"
    font-family="Georgia,serif" letter-spacing="2" opacity="0.45">点击节点查看人物档案</text>`;

  svg.innerHTML = svgContent;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
window.addEventListener('resize', debounce(() => {
  if (graphPanel.classList.contains('active')) renderGraph();
}, 300));

// ═══════════ 初始化 ═══════════
renderEpisode(0, true);

// 几秒后隐去提示
setTimeout(() => { hintEl.style.opacity = '0.12'; }, 10000);
</script>
